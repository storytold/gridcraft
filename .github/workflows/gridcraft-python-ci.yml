name: GridCraft Python CI

on:
  push:
    branches: [ main ]
    paths:
      - 'libs/mcp-python/**'
      - '.github/workflows/gridcraft-python-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'libs/mcp-python/**'
      - '.github/workflows/gridcraft-python-ci.yml'

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libs/mcp-python
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
          
      - name: Run CI checks
        run: |
          chmod +x scripts/run_ci.sh
          ./scripts/run_ci.sh all
