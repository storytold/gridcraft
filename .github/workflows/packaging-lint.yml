# Quick release-pipeline checks without a Rust build: workflow and packaging-script syntax,
# Linux desktop metadata, and the Windows desktop-shortcut installer lifecycle.
name: Packaging lint

on:
  push:
    branches: [main, release]
    paths: [".github/workflows/**", ".github/actionlint.yaml", ".github/nightly-linux-signing-key.asc", "packaging/**", "assets/app-icon/**", "docs/nightly-signing-policy.example.json", "sonar-project.properties"]
  pull_request:
    paths: [".github/workflows/**", ".github/actionlint.yaml", ".github/nightly-linux-signing-key.asc", "packaging/**", "assets/app-icon/**", "docs/nightly-signing-policy.example.json", "sonar-project.properties"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packaging-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # Intentionally tracked at @main (not SHA-pinned) so org-wide CI improvements, security fixes, and build optimizations propagate without PR churn across all craftapp repos.
    uses: storytold/craft-common-actions/.github/workflows/packaging-lint.yml@main

  nightly-source-contract:
    name: Nightly source contracts (no build or signing)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Run the synthetic nightly packaging suites
        run: python3 packaging/nightly-tests.py
      - name: Check the committed nightly icons still match their provenance
        run: python3 packaging/nightly-icons.py --check

  windows-install-policy:
    timeout-minutes: 10
    name: Windows installation policy (no app build)
    runs-on: windows-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned packaging toolchain
        shell: pwsh
        run: |
          $tools = Join-Path $env:RUNNER_TEMP 'craft-install-policy-wix'
          dotnet tool install --tool-path $tools wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) { throw 'WiX installation failed.' }
          $tools >> $env:GITHUB_PATH
          $policy = Get-Content -Raw -LiteralPath packaging/windows/install-policy.json | ConvertFrom-Json
          foreach ($extension in @($policy.extensions)) {
            & (Join-Path $tools 'wix.exe') extension add -g "WixToolset.$extension.wixext/5.0.2"
            if ($LASTEXITCODE -ne 0) { throw "WiX extension $extension installation failed." }
          }
      - name: Build and check non-executable installer fixtures
        shell: pwsh
        run: ./packaging/windows/test-install-policy.ps1 -OutputDirectory (Join-Path $env:RUNNER_TEMP 'craft-install-policy-tests')
