# Quick release-pipeline checks without a Rust build: workflow and packaging-script syntax,
# Linux desktop metadata, and the Windows folder/desktop-shortcut installer lifecycle.
name: Packaging lint

on:
  push:
    branches: [main, release]
    paths: [".github/workflows/**", "packaging/**", "assets/app-icon/**"]
  pull_request:
    paths: [".github/workflows/**", "packaging/**", "assets/app-icon/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packaging-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # Intentionally tracked at @main (not SHA-pinned) so org-wide CI improvements, security fixes, and build optimizations propagate without PR churn across all craftapp repos.
    uses: storytold/craft-common-actions/.github/workflows/packaging-lint.yml@main

  desktop-shortcut:
    name: Windows installer smoke (${{ matrix.arch }})
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build fixture MSIs and test installer lifecycle
        shell: pwsh
        run: |
          dotnet tool install --tool-path "$env:RUNNER_TEMP\wix" wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) { throw 'Could not install WiX' }
          $env:PATH = "$env:RUNNER_TEMP\wix;$env:PATH"
          wix extension add -g WixToolset.UI.wixext/5.0.2
          if ($LASTEXITCODE -ne 0) { throw 'Could not install WiX UI extension' }
          ./packaging/windows/test-desktop-shortcut.ps1 -Arch '${{ matrix.arch }}'
      - name: Capture native MSI dialog previews
        shell: pwsh
        run: |
          pwsh -NoProfile -STA -File ./packaging/windows/preview-installer-dialogs.ps1 `
            -Msi "$env:RUNNER_TEMP\gridcraft-shortcut-smoke\gridcraft-90.0.0.msi" `
            -OutputDir "$env:RUNNER_TEMP\gridcraft-shortcut-smoke\dialogs"
          if ($LASTEXITCODE -ne 0) { throw 'Native MSI dialog preview failed' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: desktop-shortcut-msi-evidence-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/gridcraft-shortcut-smoke/*.log
            ${{ runner.temp }}/gridcraft-shortcut-smoke/dialogs/*
          if-no-files-found: ignore
          retention-days: 7
