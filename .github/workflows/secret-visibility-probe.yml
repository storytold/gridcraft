name: environment secret visibility probe (throwaway)
on:
  workflow_dispatch:
  push:
    branches: [diag/**]
permissions:
  contents: read
jobs:
  plain:
    name: A no environment
    runs-on: ubuntu-24.04
    env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
          LINUX_SIGNING_KEY: ${{ secrets.LINUX_SIGNING_KEY }}
          THIS_SECRET_DOES_NOT_EXIST: ${{ secrets.THIS_SECRET_DOES_NOT_EXIST }}
    steps:
      - name: presence only
        run: |
          echo "APPLE_CERTIFICATE=${{ secrets.APPLE_CERTIFICATE != '' }}"
          echo "APPLE_CERTIFICATE_PASSWORD=${{ secrets.APPLE_CERTIFICATE_PASSWORD != '' }}"
          echo "KEYCHAIN_PASSWORD=${{ secrets.KEYCHAIN_PASSWORD != '' }}"
          echo "APPLE_ID=${{ secrets.APPLE_ID != '' }}"
          echo "APPLE_PASSWORD=${{ secrets.APPLE_PASSWORD != '' }}"
          echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID != '' }}"
          echo "WINDOWS_CERTIFICATE=${{ secrets.WINDOWS_CERTIFICATE != '' }}"
          echo "WINDOWS_CERTIFICATE_PASSWORD=${{ secrets.WINDOWS_CERTIFICATE_PASSWORD != '' }}"
          echo "AZURE_TENANT_ID=${{ secrets.AZURE_TENANT_ID != '' }}"
          echo "AZURE_CLIENT_ID=${{ secrets.AZURE_CLIENT_ID != '' }}"
          echo "AZURE_CLIENT_SECRET=${{ secrets.AZURE_CLIENT_SECRET != '' }}"
          echo "AZURE_SIGNING_ENDPOINT=${{ secrets.AZURE_SIGNING_ENDPOINT != '' }}"
          echo "AZURE_SIGNING_ACCOUNT=${{ secrets.AZURE_SIGNING_ACCOUNT != '' }}"
          echo "AZURE_CERT_PROFILE=${{ secrets.AZURE_CERT_PROFILE != '' }}"
          echo "LINUX_SIGNING_KEY=${{ secrets.LINUX_SIGNING_KEY != '' }}"
          echo "THIS_SECRET_DOES_NOT_EXIST=${{ secrets.THIS_SECRET_DOES_NOT_EXIST != '' }}"
  with_env:
    name: B with environment release
    runs-on: ubuntu-24.04
    environment: release
    env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
          LINUX_SIGNING_KEY: ${{ secrets.LINUX_SIGNING_KEY }}
          THIS_SECRET_DOES_NOT_EXIST: ${{ secrets.THIS_SECRET_DOES_NOT_EXIST }}
    steps:
      - name: presence only
        run: |
          echo "APPLE_CERTIFICATE=${{ secrets.APPLE_CERTIFICATE != '' }}"
          echo "APPLE_CERTIFICATE_PASSWORD=${{ secrets.APPLE_CERTIFICATE_PASSWORD != '' }}"
          echo "KEYCHAIN_PASSWORD=${{ secrets.KEYCHAIN_PASSWORD != '' }}"
          echo "APPLE_ID=${{ secrets.APPLE_ID != '' }}"
          echo "APPLE_PASSWORD=${{ secrets.APPLE_PASSWORD != '' }}"
          echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID != '' }}"
          echo "WINDOWS_CERTIFICATE=${{ secrets.WINDOWS_CERTIFICATE != '' }}"
          echo "WINDOWS_CERTIFICATE_PASSWORD=${{ secrets.WINDOWS_CERTIFICATE_PASSWORD != '' }}"
          echo "AZURE_TENANT_ID=${{ secrets.AZURE_TENANT_ID != '' }}"
          echo "AZURE_CLIENT_ID=${{ secrets.AZURE_CLIENT_ID != '' }}"
          echo "AZURE_CLIENT_SECRET=${{ secrets.AZURE_CLIENT_SECRET != '' }}"
          echo "AZURE_SIGNING_ENDPOINT=${{ secrets.AZURE_SIGNING_ENDPOINT != '' }}"
          echo "AZURE_SIGNING_ACCOUNT=${{ secrets.AZURE_SIGNING_ACCOUNT != '' }}"
          echo "AZURE_CERT_PROFILE=${{ secrets.AZURE_CERT_PROFILE != '' }}"
          echo "LINUX_SIGNING_KEY=${{ secrets.LINUX_SIGNING_KEY != '' }}"
          echo "THIS_SECRET_DOES_NOT_EXIST=${{ secrets.THIS_SECRET_DOES_NOT_EXIST != '' }}"
