<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- GridCraft PLACEHOLDER icon: a ledger page with a selected cell, on GridCraft green.
       Original work; temporary until the owner's engraved creature portrait replaces it
       (craftrules standards/icon-design.md). Palette: ink #0b0b0c, paper #efe9dc,
       app colour #1f9d55 (proposed), darker app colour #147a40. Drawn for small sizes: few shapes, no hairlines
       (ink strokes >= 12/512, so >= 1 px at 48 px). gridcraft-small.svg is the 16-32 px cut. -->
  <defs>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="#1f9d55"/>
    <g transform="rotate(-6 260 260)" stroke="#0b0b0c" stroke-linejoin="round" stroke-linecap="round">
      <!-- page with a folded top-right corner -->
      <path d="M104 72 H344 L416 144 V448 H104 Z" fill="#efe9dc" stroke-width="18"/>
      <path d="M344 72 V144 H416" fill="none" stroke-width="14"/>
      <!-- title line -->
      <path d="M140 110 H286" stroke-width="18"/>
      <!-- header row and row-number column, in the darker app colour (keeps them green when macOS darkens the field) -->
      <path d="M104 144 H416 V200 H164 V448 H104 Z" fill="#147a40" stroke="none"/>
      <!-- grid: three columns, three rows -->
      <path d="M104 144 H416 M104 200 H416 M104 283 H416 M104 366 H416
               M164 144 V448 M248 144 V448 M332 144 V448" fill="none" stroke-width="12"/>
      <!-- page outline again, over the header fill -->
      <path d="M104 72 H344 L416 144 V448 H104 Z" fill="none" stroke-width="18"/>
      <!-- the selected cell and its fill handle -->
      <rect x="248" y="283" width="84" height="83" fill="none" stroke-width="22"/>
      <rect x="314" y="348" width="36" height="36" fill="#0b0b0c" stroke="#efe9dc" stroke-width="7"/>
    </g>
  </g>
</svg>
