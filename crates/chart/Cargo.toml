[package]
name = "gridcraft-chart"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GridCraft charts: data resolution, layout into toolkit-free primitives, sparklines and a small rasteriser"

[lints]
workspace = true

[dependencies]
gridcraft-core = { workspace = true }
gridcraft-model = { workspace = true }
gridcraft-calc = { workspace = true }
gridcraft-numfmt = { workspace = true }
serde = { workspace = true }
resvg = { version = "0.48.1", default-features = false, features = ["text", "system-fonts"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Font bytes only: the browser has no system font directory.
epaint_default_fonts = { workspace = true }

[dev-dependencies]
epaint_default_fonts = { workspace = true }
