[package]
name = "gridcraft-collab-client"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "GridCraft real-time collaboration client: WebSocket session and the local document it keeps in step"

[lints]
workspace = true

[dependencies]
gridcraft-collab = { workspace = true }
gridcraft-engine = { workspace = true }
gridcraft-xlsx = { workspace = true }
tokio = { version = "1", features = ["rt", "sync", "time", "net", "macros"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
base64 = "0.22"
chrono = { workspace = true }

[dev-dependencies]
gridcraft-collab-server = { path = "../../apps/gridcraft-collab-server" }
jsonwebtoken = "9.3"
axum = { version = "0.8", features = ["ws"] }
chrono = { workspace = true }
