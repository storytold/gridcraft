[package]
name = "gridcraft-collab-web"
description = "Web-side collaboration session: the protocol over the browser's WebSocket, opened by the host bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
gridcraft-collab = { workspace = true }
gridcraft-collab-client = { workspace = true }
gridcraft-engine = { workspace = true }
gridcraft-ui-egui = { workspace = true }
serde_json = { workspace = true }
base64 = "0.22"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Event", "MessageEvent", "CloseEvent", "WebSocket", "BinaryType"] }
