[package]
name = "gridcraft-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GridCraft core types: cell addresses, values, errors, date serials"

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"

# The system region when no locale variable names one (`region::system`).
[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSLocale", "NSString"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[dev-dependencies]
serde_json = { workspace = true }
