[package]
name = "gridcraft-datasource"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GridCraft database drivers for Data › Get Data › From Database (native only)"

[lints]
workspace = true

[features]
# Each driver can be left out of a build. PostgreSQL, MySQL/MariaDB and SQLite are in by default;
# a request for a driver that is left out fails with an error instead of connecting.
default = ["postgres", "mysql", "sqlite"]
postgres = [
    "dep:postgres",
    "dep:chrono",
    "dep:serde_json",
    "dep:uuid",
    "dep:tokio-postgres-rustls",
    "dep:rustls",
    "dep:webpki-roots",
    "dep:rustls-native-certs",
]
mysql = ["dep:mysql"]
# SQLite is compiled from the bundled C sources (`libsqlite3-sys`).
sqlite = ["dep:rusqlite"]
# ODBC through the system driver manager (unixODBC / iODBC / Windows ODBC). Off by default so a
# plain build needs no system library; release builds turn it on.
odbc = ["dep:odbc-api"]

[dependencies]
gridcraft-engine = { workspace = true }
log = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
postgres = { version = "0.19", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"], optional = true }
chrono = { version = "0.4", default-features = false, features = ["std"], optional = true }
serde_json = { workspace = true, optional = true }
uuid = { version = "1", default-features = false, features = ["std"], optional = true }
mysql = { version = "28", default-features = false, features = ["minimal-rust", "rustls-tls-ring", "buffer-pool"], optional = true }
rusqlite = { version = "0.40", features = ["bundled", "hooks", "column_decltype"], optional = true }
# TLS for PostgreSQL (MySQL brings its own through `rustls-tls-ring`): the same rustls and ring.
tokio-postgres-rustls = { version = "0.14", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"], optional = true }
webpki-roots = { version = "1", optional = true }
rustls-native-certs = { version = "0.8", optional = true }
odbc-api = { version = "29", optional = true }
