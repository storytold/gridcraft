name = "Table"
kind = "Table"
[[function.params]]
name = "Expression"
kind = "Expression"
[[function.params]]
name = "Variant"
kind = "Logical"
optional = true
[[function.signature]]
kinds = ["Table", "Expression"]
variadic = false
[[function.signature]]
kinds = ["Table", "Expression", "Logical"]
variadic = false

[[function]]
name = "PRODUCT"
min = 1
max = 1
returns = "decimal"
flags = "standard"
sugar = "PRODUCTX"
blank = "blank"
description = "Multiplies the numbers in a column, ignoring blanks, logical values and text. Syntax sugar for PRODUCTX."
examples = ["PRODUCT ( Sales[Quantity] )"]
[[function.params]]
name = "ColumnName"
kind = "Column"
[[function.signature]]
kinds = ["Column"]
variadic = false

[[function]]
name = "PRODUCTX"
min = 2
max = 2
returns = "decimal"
flags = "standard-iterator"
blank = "blank"
description = "Evaluates the expression per row and multiplies the non-blank numeric results; blanks, logical values and text are ignored, unlike the `*` operator."
examples = ["PRODUCTX ( Rates, 1 + Rates[InflationRate] )", "PRODUCTX ( Sales, Sales[Quantity] )"]
[[function.params]]
name = "Table"
kind = "Table"
[[function.params]]
name = "Expression"
kind = "Expression"
[[function.signature]]
kinds = ["Table", "Expression"]
variadic = false

[[function]]
name = "SUM"
min = 1
max = 1
returns = "numeric"
flags = "standard"
sugar = "SUMX"
blank = "blank"
description = "Adds the numbers in a column, ignoring blanks, logical values and text. Syntax sugar for SUMX. dax.guide says the result type follows the column, while Microsoft Learn documents a decimal number."
examples = ["SUM ( Sales[Amount] )", "SUM ( Sales[Quantity] )"]
[[function.params]]
name = "ColumnName"
kind = "Column"
[[function.signature]]
kinds = ["Column"]
variadic = false

[[function]]
name = "SUMX"
min = 2
max = 2
returns = "numeric"
flags = "standard-iterator"
blank = "blank"
description = "Evaluates the expression once per row of the table and sums the numeric results; blanks, logical values and text are ignored. The expression runs in row context."
examples = ["SUMX ( Sales, Sales[Quantity] * Sales[Net Price] )", "SUMX ( FILTER ( InternetSales, InternetSales[SalesTerritoryID] = 5 ), [Freight] )"]
[[function.params]]
name = "Table"
kind = "Table"
[[function.params]]
name = "Expression"
kind = "Expression"
[[function.signature]]
kinds = ["Table", "Expression"]
variadic = false
