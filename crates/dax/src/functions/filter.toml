# Filter functions — declarative catalog data, one row per function.
# Loaded by the shared `catalog` module; see its docs for the schema.

[[function]]
name = "ALL"
min = 0
max = 0
max_open = true
returns = "table"
flags = "excel"
description = "Returns a table ignoring any filters on it, or every value of a column ignoring the filters on that column. As a table expression it materialises all rows (or all distinct values of one or more columns). Without arguments it works only inside CALCULATE/CALCULATETABLE and clears the whole filter context."
examples = ["ALL ( Sales )", "ALL ( Sales[Region] )", "ALL ( Sales, Sales[Region], Sales[Country] )", "ALL ( )"]
[[function.params]]
name = "TableNameOrColumnName"
kind = "Reference"
optional = true
[[function.params]]
name = "ColumnName"
kind = "Column"
optional = true
[[function.signature]]
kinds = []
variadic = false
[[function.signature]]
kinds = ["Reference"]
variadic = false
[[function.signature]]
kinds = ["Reference", "Column"]
variadic = true

[[function]]
name = "ALLCROSSFILTERED"
min = 1
max = 1
returns = "table"
flags = "excel"
description = "Removes, as a CALCULATE modifier only, every filter on a table and on the tables that cross-filter it through weak or bidirectional relationships. Unlike ALL it never returns a materialised table, so it cannot be used as a table expression."
examples = ["ALLCROSSFILTERED ( Sales )", "ALLCROSSFILTERED ( 'Product' )"]
[[function.params]]
name = "TableName"
kind = "Table"
[[function.signature]]
kinds = ["Table"]
variadic = false

[[function]]
name = "ALLEXCEPT"
min = 2
max = 0
max_open = true
returns = "table"
flags = "excel"
description = "Removes all filters from a table except those on the listed columns. As a CALCULATE modifier it keeps only the named column filters; as a table expression it materialises the unique combinations of the table's remaining columns."
examples = ["ALLEXCEPT ( Sales, Sales[Region] )", "ALLEXCEPT ( 'Product', 'Product'[Color], 'Product'[Brand] )"]
[[function.params]]
name = "TableName"
kind = "Table"
[[function.params]]
name = "ColumnName"
kind = "Column"
[[function.params]]
name = "ColumnName"
kind = "Column"
optional = true
[[function.signature]]
kinds = ["Table", "Column"]
variadic = true

[[function]]
name = "ALLNOBLANKROW"
min = 1
max = 0
max_open = true
returns = "table"
flags = "excel"
description = "Like ALL, removes the filters on a table or on the listed columns, but always excludes the blank row that the engine adds for an invalid relationship. Real blank values stored in the columns are kept in the result."
examples = ["ALLNOBLANKROW ( Customer )", "ALLNOBLANKROW ( Customer[Country], Customer[City] )"]
[[function.params]]
name = "TableNameOrColumnName"
kind = "Reference"
[[function.params]]
name = "ColumnName"
kind = "Column"
optional = true
[[function.signature]]
kinds = ["Reference"]
variadic = false
[[function.signature]]
kinds = ["Reference", "Column"]
variadic = true

[[function]]
name = "ALLSELECTED"
min = 0
max = 0
max_open = true
returns = "table"
flags = "excel"
description = "Restores the filters that came from outside the query while ignoring the filters applied inside it, so the result reflects the outer shadow filter context. As a table expression it needs at least one argument; without arguments it is only a CALCULATE modifier."
examples = ["ALLSELECTED ( Sales )", "ALLSELECTED ( Sales[Region] )", "ALLSELECTED ( )"]
[[function.params]]
name = "TableNameOrColumnName"
kind = "Reference"
optional = true
[[function.params]]
name = "ColumnName"
kind = "Column"
optional = true
[[function.signature]]
kinds = []
variadic = false
[[function.signature]]
kinds = ["Reference"]
variadic = false
[[function.signature]]
kinds = ["Reference", "Column"]
variadic = true

[[function]]
name = "ALLSELECTEDAPPLY"
min = 1
max = 1
returns = "table"
flags = "internal"
description = "Marks a table expression supplied to GROUPCROSSAPPLY or GROUPCROSSAPPLYTABLE so that it starts hidden from the filter context and only becomes active when ALLSELECTED runs inside CALCULATE. Used internally by Power BI composite models."
examples = ["ALLSELECTEDAPPLY ( VALUES ( Product[Color] ) )"]
[[function.params]]
name = "TableExpression"
kind = "Table"
[[function.signature]]
kinds = ["Table"]
variadic = false

[[function]]
name = "ALLSELECTEDREMOVE"
min = 1
max = 0
max_open = true
returns = "table"
flags = "internal"
description = "In GROUPCROSSAPPLY or GROUPCROSSAPPLYTABLE, hides the listed columns of a table expression from a later ALLSELECTED so they no longer participate in the restored filter context. With no column argument every column of the expression is hidden."
examples = ["ALLSELECTEDREMOVE ( VALUES ( Product[Color] ) )", "ALLSELECTEDREMOVE ( VALUES ( Product[Color] ), Product[Color] )"]
[[function.params]]
name = "TableExpression"
kind = "Table"
[[function.params]]
name = "Column"
kind = "Column"
optional = true
[[function.signature]]
kinds = ["Table"]
variadic = false
[[function.signature]]
kinds = ["Table", "Column"]
variadic = true

[[function]]
name = "ALWAYSAPPLY"
min = 1
max = 1
returns = "table"
flags = "internal"
description = "In GROUPCROSSAPPLY or GROUPCROSSAPPLYTABLE, forces a filter table to influence the measures even if the current filter context is unchanged, for example when the table is empty. Used internally by Power BI composite models."
examples = ["ALWAYSAPPLY ( FILTER ( VALUES ( Product[Color] ), FALSE ) )"]
[[function.params]]
name = "TableExpression"
kind = "Table"
[[function.signature]]
kinds = ["Table"]
variadic = false

[[function]]
name = "CALCULATE"
min = 1
max = 0
max_open = true
returns = "any"
flags = "excel"
description = "Evaluates an expression in a filter context modified by its filter arguments: table expressions replace the filters on their columns, boolean predicates are wrapped in FILTER over ALL, and context transition turns any row context into an equivalent filter context. Returns the scalar result of the expression."
examples = ["CALCULATE ( SUM ( Sales[Amount] ), Sales[Region] = \"East\" )", "CALCULATE ( [Sales Amount], ALL ( Product ) )"]
[[function.params]]
name = "Expression"
kind = "Expression"
[[function.params]]
name = "Filter"
kind = "Any"
optional = true
[[function.signature]]
kinds = ["Expression"]
variadic = false
[[function.signature]]
kinds = ["Expression", "Any"]
variadic = true

[[function]]
name = "CALCULATETABLE"
min = 1
max = 0
max_open = true
returns = "table"
flags = "excel"
description = "Runs a table expression under the filter context built by its filter arguments, with the same filter semantics and context transition as CALCULATE but returning a table instead of a scalar."
examples = ["CALCULATETABLE ( VALUES ( Product[Color] ), Product[Brand] = \"GridCraft\" )"]
[[function.params]]
name = "Table"
kind = "Table"
[[function.params]]
name = "Filter"
kind = "Any"
optional = true
[[function.signature]]
kinds = ["Table"]
variadic = false
[[function.signature]]
kinds = ["Table", "Any"]
variadic = true

[[function]]
name = "DEPENDON"
min = 2
max = 0
max_open = true
returns = "table"
flags = "internal"
description = "Anchors a table expression to outer columns: its first columns are matched, in order, against the current values of the listed outer columns, acting as an inner join and hiding the matched columns from the result. Used internally by Power BI composite models."
examples = ["DEPENDON ( Sales, Sales[OrderDate] )", "DEPENDON ( FILTER ( Sales, Sales[Amount] > 0 ), Sales[OrderDate] )"]
[[function.params]]
name = "TableExpression"
kind = "Table"
[[function.params]]
name = "ColumnName"
kind = "Column"
[[function.params]]
name = "ColumnName"
kind = "Column"
optional = true
[[function.signature]]
kinds = ["Table", "Column"]
variadic = true

[[function]]
name = "FILTER"
min = 2
max = 2
returns = "table"
flags = "iterator-excel"
description = "Returns the rows of a table for which the predicate is TRUE. The predicate runs in a row context, so it can read the current row's columns; context transition applies when it calls a measure, and BLANK evaluates as FALSE. Filter context is preserved, not replaced."
examples = ["FILTER ( Sales, Sales[Amount] > 0 )", "FILTER ( ALL ( Sales ), Sales[Region] = \"East\" )"]
[[function.params]]
name = "Table"
kind = "Table"
[[function.params]]
name = "FilterExpression"
kind = "Logical"
[[function.signature]]
kinds = ["Table", "Logical"]
variadic = false

[[function]]
name = "FILTERCLUSTER"
min = 4
max = 0
max_open = true
returns = "table"
flags = "internal"
description = "Internal helper for GROUPCROSSAPPLY and GROUPCROSSAPPLYTABLE that assembles the correlated join over a set of groups: group-by columns, filter tables and table scans are combined with autoexist semantics, and the literal separator only marks where the table scans begin. Used internally by Power BI composite models."
examples = ["FILTERCLUSTER ( Product[Category], ALL ( Product ), \"\", ALL ( Sales ) )"]
[[function.params]]
name = "GroupBy_ColumnName"
kind = "Column"
[[function.params]]
name = "FilterTable"
kind = "Table"
[[function.params]]
name = "Separator"
kind = "Text"
[[function.params]]
name = "TableScan"
kind = "Table"
[[function.signature]]
kinds = ["Column", "Any", "Text", "Any"]
variadic = true

[[function]]
name = "GROUPCROSSAPPLY"
min = 2
max = 0
max_open = true
returns = "table"
flags = "internal"
description = "Aggregates by the group-by columns across cross-joined filter tables, with no implicit autoexist. Each name/expression pair adds a column, and rows whose expressions are all blank are dropped. Used internally by Power BI composite models."
examples = ["GROUPCROSSAPPLY ( 'Date'[Year], ALL ( 'Date' ) )", "GROUPCROSSAPPLY ( 'Date'[Year], ALL ( 'Date' ), \"Sales\", [Sales Amount] )"]
[[function.params]]
name = "GroupBy_ColumnName"
kind = "Column"
[[function.params]]
