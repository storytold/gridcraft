kind = "Text"
optional = true
[[function.params]]
name = "Expression"
kind = "Any"
optional = true
[[function.signature]]
kinds = ["Column", "Table"]
variadic = false
[[function.signature]]
kinds = ["Column", "Any", "Any"]
variadic = true

[[function]]
name = "GROUPCROSSAPPLYTABLE"
min = 2
max = 0
max_open = true
returns = "table"
flags = "internal"
description = "Like GROUPCROSSAPPLY, but the trailing name/table-expression pairs add whole tables evaluated under the filter tables' context instead of scalar expressions. Used internally by Power BI composite models."
