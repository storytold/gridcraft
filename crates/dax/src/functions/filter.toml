kind = "Expression"
[[function.signature]]
kinds = ["Expression"]
variadic = false

[[function]]
name = "LOOKUP"
min = 3
max = 0
max_open = true
returns = "any"
flags = "internal"
description = "Searches the cells identified by the search column/value pairs and returns a column value or an expression evaluated over those cells; filters on columns not listed stay applied. Only one cell may match, and the optional behaviour argument selects Explicit or Inferred handling of associated columns."
examples = ["LOOKUP ( [Sales Amount], 'Date'[Year], 2018 )", "LOOKUP ( [Sales Amount], 'Date'[Year], 2018, \"Inferred\" )"]
