min = 3
max = 0
max_open = true
returns = "any"
flags = "excel"
description = "Returns the result column value from the row where every search column/value pair matches, ignoring the current filter context. With no match it returns BLANK or the alternate result; identical values in several matching rows return that value, while different values return the alternate result or an error."
