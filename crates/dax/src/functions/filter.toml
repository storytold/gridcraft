[[function]]
name = "KEEPFILTERS"
min = 1
max = 1
returns = "any"
flags = "excel"
description = "Filter modifier that makes its argument intersect the existing filter context instead of replacing it, so a conflicting existing filter is kept. Applies to a CALCULATE or CALCULATETABLE filter argument and also preserves the filter context during context transition in an iterator."
examples = ["KEEPFILTERS ( Product[Color] = \"Red\" )", "KEEPFILTERS ( VALUES ( Product[Color] ) )"]
[[function.params]]
