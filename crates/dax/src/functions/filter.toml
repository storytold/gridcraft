[[function]]
name = "INDEX"
min = 1
max = 7
returns = "table"
flags = "internal"
description = "Returns, as a one-row table, the row at an absolute position (1-based, negative counts from the end) within each partition of the relation, sorted by the ORDERBY clause. An out-of-range or zero position yields an empty table; the relation defaults to ALLSELECTED over the ordering and partitioning columns."
examples = ["INDEX ( 1, Sales, ORDERBY ( Sales[OrderDate] ) )", "INDEX ( -1, ALLSELECTED ( Sales ) )", "INDEX ( 1, Sales, ORDERBY ( Sales[OrderDate] ), KEEP, PARTITIONBY ( Sales[Region] ) )"]
