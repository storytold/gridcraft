[[function]]
name = "AMORDEGRC"
min = 6
max = 7
returns = "decimal"
flags = "excel"
description = "Depreciation of an asset for one accounting period under the French accounting system, with a coefficient derived from the asset life (1/Rate). A purchase in the middle of a period is prorated. Basis accepts only 0, 1, 3 or 4; period 0 is the first, prorated period."
