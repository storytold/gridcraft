# Information functions — declarative catalog data, one row per function.
# Loaded by the shared `catalog` module; see its docs for the schema.

[[function]]
name = "COLUMNSTATISTICS"
min = 0
max = 0
returns = "table"
flags = "visual"
description = "Returns one row per column visible in the model, with the table name, column name, minimum, maximum, cardinality and maximum string length. The statistics respect the security roles of the connected user."
examples = ["COLUMNSTATISTICS ()"]
[[function.signature]]
kinds = []
variadic = false

[[function]]
name = "CONTAINS"
min = 3
max = 0
max_open = true
returns = "boolean"
flags = "excel"
description = "Returns TRUE when at least one row of the table has all the supplied column/value pairs. Each pair is a column reference followed by the value to match, using strict equality (BLANK does not match 0)."
examples = ["CONTAINS ( Product, Product[Color], \"Red\" )", "CONTAINS ( Sales, Sales[ProductKey], 1, Sales[Quantity], 2 )"]
[[function.params]]
name = "Table"
kind = "Table"
[[function.params]]
name = "ColumnName"
kind = "Column"
[[function.params]]
name = "Value"
kind = "Any"
[[function.signature]]
kinds = ["Table", "Column", "Any"]
variadic = true

[[function]]
name = "CONTAINSROW"
min = 2
max = 0
max_open = true
returns = "boolean"
flags = "excel"
description = "Returns TRUE when the table has a row whose values equal every supplied value, in column order. The IN operator executes this function; comparisons are strict, so BLANK does not match 0."
examples = ["CONTAINSROW ( { \"Red\", \"Blue\" }, Product[Color] )", "CONTAINSROW ( Sales, Sales[ProductKey], 1 )"]
[[function.params]]
name = "Table"
kind = "Table"
[[function.params]]
name = "Value"
kind = "Any"
[[function.signature]]
kinds = ["Table", "Any"]
variadic = true

[[function]]
name = "CONTAINSSTRING"
min = 2
max = 2
returns = "boolean"
flags = "excel"
description = "Returns TRUE when WithinText contains FindText. The comparison is case-insensitive and accent-sensitive; `?` and `*` are wildcards and `~?` / `~*` match them literally."
examples = ["CONTAINSSTRING ( Product[Product Name], \"red\" )", "CONTAINSSTRING ( \"Hello\", \"ell\" )"]
[[function.params]]
name = "WithinText"
kind = "Text"
[[function.params]]
name = "FindText"
kind = "Text"
[[function.signature]]
kinds = ["Text", "Text"]
variadic = false

[[function]]
name = "CONTAINSSTRINGEXACT"
min = 2
max = 2
returns = "boolean"
flags = "excel"
description = "Returns TRUE when WithinText contains FindText using a case-sensitive and accent-sensitive comparison. Wildcards are not interpreted."
examples = ["CONTAINSSTRINGEXACT ( Product[Product Name], \"Red\" )", "CONTAINSSTRINGEXACT ( \"Hello\", \"Hell\" )"]
[[function.params]]
name = "WithinText"
kind = "Text"
[[function.params]]
name = "FindText"
kind = "Text"
[[function.signature]]
kinds = ["Text", "Text"]
variadic = false

[[function]]
name = "CUSTOMDATA"
min = 0
max = 0
returns = "string"
flags = "volatile-standard"
description = "Returns the CustomData connection-string property supplied by the client, or BLANK when the connection did not define it. It does not inspect the data model or the filter context."
examples = ["CUSTOMDATA ()"]
[[function.signature]]
kinds = []
variadic = false

[[function]]
name = "EVALUATEANDLOG"
min = 1
max = 3
returns = "variant"
flags = "visual"
description = "Returns the first argument unchanged and writes its value to the DAX Evaluation Log trace event. The optional Label annotates the event; MaxRows caps the rows captured for a table expression and defaults to 10."
examples = ["EVALUATEANDLOG ( 1 )", "EVALUATEANDLOG ( [Sales Amount] )", "EVALUATEANDLOG ( Sales, \"Sales rows\", 5 )"]
[[function.params]]
name = "Value"
kind = "Any"
[[function.params]]
name = "Label"
kind = "Text"
optional = true
[[function.params]]
name = "MaxRows"
kind = "Number"
optional = true
[[function.signature]]
kinds = ["Any"]
variadic = false
[[function.signature]]
kinds = ["Any", "Text"]
variadic = false
[[function.signature]]
kinds = ["Any", "Text", "Number"]
variadic = false

[[function]]
name = "HASONEFILTER"
min = 1
max = 1
returns = "boolean"
flags = "excel"
description = "Returns TRUE when the column has exactly one distinct value resulting from direct filters on that column. Unlike HASONEVALUE it ignores filters propagated from related tables."
examples = ["HASONEFILTER ( Product[Color] )", "HASONEFILTER ( Sales[Quantity] )"]
[[function.params]]
name = "ColumnName"
kind = "Column"
[[function.signature]]
kinds = ["Column"]
variadic = false

[[function]]
name = "HASONEVALUE"
min = 1
max = 1
returns = "boolean"
flags = "excel"
description = "Returns TRUE when the filter context leaves exactly one distinct value in the column, regardless of whether the filter is direct or propagated through a relationship."
examples = ["HASONEVALUE ( Product[Category] )", "HASONEVALUE ( Sales[Quantity] )"]
[[function.params]]
name = "ColumnName"
kind = "Column"
[[function.signature]]
kinds = ["Column"]
variadic = false

[[function]]
name = "INFO.VIEW.COLUMNS"
min = 0
max = 0
returns = "table"
flags = "visual"
description = "Table of every column in the model, decoded so a query can use it without joins to other DMV rowsets. Unlike the plain INFO functions it is allowed in measures, calculated columns and calculated tables."
examples = ["INFO.VIEW.COLUMNS ()"]
[[function.signature]]
kinds = []
variadic = false

