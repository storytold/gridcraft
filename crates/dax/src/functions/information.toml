[[function.params]]
name = "Value"
kind = "Any"
[[function.signature]]
kinds = ["Any"]
variadic = false

[[function]]
name = "ISEMPTY"
min = 1
max = 1
returns = "boolean"
flags = "excel"
description = "Returns TRUE when the table expression has no rows in the current evaluation context, including tables whose only row would be blank."
examples = ["ISEMPTY ( Sales )", "ISEMPTY ( FILTER ( Sales, FALSE ) )"]
[[function.params]]
name = "Table"
kind = "Table"
[[function.signature]]
kinds = ["Table"]
variadic = false

[[function]]
name = "ISERROR"
min = 1
max = 1
returns = "boolean"
flags = "excel"
description = "Returns TRUE when evaluating the value produces an error. It inspects the value, so the error is caught rather than propagated."
examples = ["ISERROR ( 1 / 0 )", "ISERROR ( Sales[Amount] )"]
[[function.params]]
name = "Value"
kind = "Any"
[[function.signature]]
kinds = ["Any"]
variadic = false

[[function]]
name = "ISEVEN"
min = 1
max = 1
returns = "boolean"
flags = "excel"
description = "Returns TRUE when the number is even, FALSE when it is odd. Truncation applies to non-integers, matching the mathematical sign of the truncated value."
examples = ["ISEVEN ( 4 )", "ISEVEN ( Sales[Quantity] )"]
[[function.params]]
name = "Number"
kind = "Number"
[[function.signature]]
kinds = ["Number"]
variadic = false

[[function]]
name = "ISFILTERED"
min = 1
max = 1
returns = "boolean"
flags = "excel"
description = "TRUE when the column carries direct filters in the current context; filters propagated from a related table do not count, so use ISCROSSFILTERED for those."
examples = ["ISFILTERED ( Product[Color] )", "ISFILTERED ( Sales[Quantity] )"]
[[function.params]]
name = "ColumnName"
kind = "Column"
[[function.signature]]
kinds = ["Column"]
variadic = false

[[function]]
name = "ISINSCOPE"
min = 1
max = 1
