description = "Table of every measure in the model, decoded so a query can use it without joins to other DMV rowsets. Unlike the plain INFO functions it is allowed in measures, calculated columns and calculated tables."
examples = ["INFO.VIEW.MEASURES ()"]
[[function.signature]]
kinds = []
variadic = false

[[function]]
name = "INFO.VIEW.RELATIONSHIPS"
min = 0
max = 0
returns = "table"
flags = "visual"
description = "Table of every relationship in the model, decoded so a query can use it without joins to other DMV rowsets. Unlike the plain INFO functions it is allowed in measures, calculated columns and calculated tables."
examples = ["INFO.VIEW.RELATIONSHIPS ()"]
[[function.signature]]
kinds = []
variadic = false

[[function]]
name = "INFO.VIEW.TABLES"
min = 0
max = 0
returns = "table"
flags = "visual"
description = "Table of every table in the model, decoded so a query can use it without joins to other DMV rowsets. Unlike the plain INFO functions it is allowed in measures, calculated columns and calculated tables."
examples = ["INFO.VIEW.TABLES ()"]
[[function.signature]]
kinds = []
variadic = false

[[function]]
name = "ISAFTER"
min = 2
max = 0
max_open = true
returns = "boolean"
flags = "excel"
description = "Returns TRUE when the Value1/Value2 groups compare strictly after the corresponding values in the ascending/descending order given by each optional Order flag. The comparison uses the existing evaluation context; ISAFTER is not an iterator."
examples = ["ISAFTER ( Sales[Year], 2008 )", "ISAFTER ( Sales[Year], 2008, 1 )"]
[[function.params]]
name = "Value1"
kind = "Any"
[[function.params]]
name = "Value2"
kind = "Any"
[[function.params]]
name = "Order"
kind = "Logical"
optional = true
[[function.signature]]
kinds = ["Any", "Any"]
variadic = true

[[function]]
name = "ISBLANK"
min = 1
max = 1
returns = "boolean"
flags = "excel"
description = "Returns TRUE when the value is BLANK. Zero and the empty string are not blank; the predicate is equivalent to the strict comparison `value == BLANK ()`."
examples = ["ISBLANK ( Sales[Amount] )", "ISBLANK ( BLANK () )"]
[[function.params]]
name = "Value"
kind = "Any"
[[function.signature]]
kinds = ["Any"]
variadic = false

[[function]]
name = "ISBOOLEAN"
min = 1
max = 1
returns = "boolean"
flags = "excel"
description = "TRUE for a Boolean value. Alias of ISLOGICAL."
examples = ["ISBOOLEAN ( TRUE )", "ISBOOLEAN ( Sales[Amount] )"]
[[function.params]]
name = "Value"
kind = "Any"
[[function.signature]]
kinds = ["Any"]
variadic = false

[[function]]
name = "ISCROSSFILTERED"
min = 1
max = 1
returns = "boolean"
flags = "excel"
description = "Returns TRUE when the table or column is cross-filtered, meaning a filter is applied to that table, to one of its columns, or to a column of a related table."
examples = ["ISCROSSFILTERED ( Product )", "ISCROSSFILTERED ( Product[Category] )"]
[[function.params]]
name = "TableNameOrColumnName"
kind = "Reference"
[[function.signature]]
kinds = ["Reference"]
variadic = false

[[function]]
name = "ISDATETIME"
min = 1
max = 1
returns = "boolean"
flags = "excel"
description = "Returns TRUE when the value has the Date/time type."
examples = ["ISDATETIME ( DATE ( 2008, 1, 1 ) )", "ISDATETIME ( Sales[Order Date] )"]
[[function.params]]
name = "Value"
kind = "Any"
[[function.signature]]
kinds = ["Any"]
variadic = false

[[function]]
name = "ISDECIMAL"
min = 1
max = 1
returns = "boolean"
flags = "excel"
description = "TRUE for a fixed-precision decimal (Currency) value. Alias of ISCURRENCY."
examples = ["ISDECIMAL ( 1.5 )", "ISDECIMAL ( Sales[Net Price] )"]
[[function.params]]
name = "Value"
kind = "Any"
[[function.signature]]
kinds = ["Any"]
variadic = false

[[function]]
name = "ISDOUBLE"
min = 1
max = 1
returns = "boolean"
flags = "excel"
