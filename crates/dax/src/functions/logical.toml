[[function]]
name = "SWITCH"
min = 3
max = 0
max_open = true
returns = "any"
flags = "excel"
description = "Compares the expression with each value in turn and returns the result paired with the first match; when nothing matches it returns the optional else argument, or BLANK when that argument is omitted. Values and results come in pairs, so the call needs an odd number of arguments when there is no else and an even number when there is one. All results and the else value must have the same data type. Using TRUE as the expression turns SWITCH into a cleaner alternative to cascading IF calls."
examples = ["SWITCH ( [X], 1, \"a\", 2, \"b\", \"other\" )", "SWITCH ( Sales[Region], \"North\", 1, \"South\", 2, 0 )", "SWITCH ( TRUE (), Sales[Amount] > 1000, \"Large\", Sales[Amount] > 100, \"Medium\", \"Small\" )"]
[[function.params]]
name = "Expression"
kind = "Any"
[[function.params]]
name = "Value"
kind = "Any"
[[function.params]]
name = "Result"
kind = "Any"
[[function.params]]
name = "Else"
kind = "Any"
optional = true
[[function.signature]]
kinds = ["Any", "Any", "Any"]
variadic = true

