[[function]]
name = "AND"
min = 2
max = 2
returns = "boolean"
flags = "excel"
description = "Returns TRUE when both logical arguments are TRUE, and FALSE otherwise. The function accepts exactly two arguments; use the `&&` operator to combine three or more conditions without nesting. Like the operator, it does not short-circuit when evaluated eagerly."
examples = ["AND ( Sales[Amount] > 0, Sales[Quantity] > 0 )", "AND ( TRUE, FALSE )"]
[[function.params]]
name = "Logical1"
kind = "Logical"
[[function.params]]
name = "Logical2"
kind = "Logical"
[[function.signature]]
kinds = ["Logical", "Logical"]
variadic = false

