[[function]]
name = "COALESCE"
min = 2
max = 0
max_open = true
returns = "any"
flags = "engine"
description = "The first argument whose value is not BLANK; when every argument is blank the result is BLANK. At least two arguments are required, and later arguments are not evaluated once a non-blank value is found. Unlike a chain of IF/ISBLANK checks, the result type follows the first non-blank argument."
examples = ["COALESCE ( Sales[Discount], 0 )", "COALESCE ( Store[Area Manager], \"** Not Assigned **\" )", "COALESCE ( [Sales Amount], [Budget Amount], 0 )"]
[[function.params]]
name = "Value1"
kind = "Any"
[[function.params]]
name = "Value2"
kind = "Any"
[[function.signature]]
kinds = ["Any", "Any"]
variadic = true

[[function]]
name = "FALSE"
min = 0
max = 0
returns = "boolean"
flags = "excel"
description = "Returns the logical value FALSE. `FALSE` without parentheses is the same constant; FALSE is converted to 0 when a numeric result is required."
examples = ["FALSE ()", "IF ( Sales[Amount] > 0, TRUE (), FALSE () )"]
[[function.signature]]
kinds = []
variadic = false

[[function]]
name = "IF"
min = 2
max = 3
returns = "any"
flags = "excel"
description = "Evaluates the logical test and returns `ResultIfTrue` when it is TRUE and `ResultIfFalse` otherwise. When the third argument is omitted a FALSE test returns BLANK. Only the selected branch is evaluated in the regular (strict) execution plan, and the result type follows the selected branch or the common type of both branches."
examples = ["IF ( Sales[Amount] > 0, 1, 0 )", "IF ( [Sales Amount] > 1000, \"Large\", \"Small\" )", "IF ( Sales[Quantity] > 0, Sales[Amount] )"]
[[function.params]]
name = "LogicalTest"
kind = "Logical"
[[function.params]]
name = "ResultIfTrue"
kind = "Any"
[[function.params]]
name = "ResultIfFalse"
kind = "Any"
optional = true
[[function.signature]]
kinds = ["Logical", "Any"]
variadic = false
[[function.signature]]
kinds = ["Logical", "Any", "Any"]
variadic = false

[[function]]
name = "IF.EAGER"
min = 2
max = 3
returns = "any"
flags = "eager"
description = "Same conditional semantics as IF, but forces an eager execution plan in which both branch expressions are evaluated before the test chooses one. It exists only for query optimisation and should be used only after measuring a clear advantage over IF; the result type is Variant when the branches differ."
examples = ["IF.EAGER ( Sales[Amount] > 0, 1, 0 )", "IF.EAGER ( [Sales Amount] > 1000, \"Large\", \"Small\" )"]
[[function.params]]
name = "LogicalTest"
kind = "Logical"
[[function.params]]
name = "ResultIfTrue"
kind = "Any"
[[function.params]]
name = "ResultIfFalse"
kind = "Any"
optional = true
[[function.signature]]
kinds = ["Logical", "Any"]
variadic = false
[[function.signature]]
kinds = ["Logical", "Any", "Any"]
variadic = false

[[function]]
name = "IFERROR"
min = 2
max = 2
returns = "any"
flags = "discouraged"
description = "Yields `ValueIfError` when the first argument raises an error, and otherwise repeats the first argument's value; faster than the equivalent `IF ( ISERROR ( Value ), ValueIfError, Value )`. Neither IFERROR nor ISERROR catches every runtime error, because block-mode execution can bypass the check, so both are discouraged."
examples = ["IFERROR ( 1 / 0, 0 )", "IFERROR ( VALUE ( Sales[Text] ), BLANK () )"]
[[function.params]]
name = "Value"
kind = "Any"
[[function.params]]
name = "ValueIfError"
kind = "Any"
[[function.signature]]
kinds = ["Any", "Any"]
variadic = false

