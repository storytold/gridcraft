[[function]]
name = "RANK"
min = 0
max = 7
returns = "integer"
flags = "engine"
description = "Returns the rank of the current row inside its partition, ordered by an ORDERBY clause. The optional Ties argument selects DENSE or SKIP (SKIP is the default), Blanks controls where blank ordering values sort, PARTITIONBY splits the table, MATCHBY identifies the current row and Reset restarts the numbering. Relation defaults to ALLSELECTED of the ordering and partitioning columns, and either Relation or ORDERBY must be supplied."
examples = ["RANK ( DENSE, Sales, ORDERBY ( Sales[Amount] ) )", "RANK ( SKIP, Sales, ORDERBY ( Sales[Amount], DESC ) )"]
