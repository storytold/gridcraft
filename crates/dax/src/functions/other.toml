[[function]]
name = "ROWNUMBER"
min = 0
max = 6
returns = "integer"
flags = "engine"
description = "Returns the unique row number of the current row inside its partition, ordered by an ORDERBY clause. Unlike RANK, ties receive different numbers. The optional Blanks, PARTITIONBY, MATCHBY and Reset arguments behave as they do for RANK; either Relation or ORDERBY must be supplied."
