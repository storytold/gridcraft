# Other functions — declarative catalog data, one row per function.
# Loaded by the shared `catalog` module; see its docs for the schema.

[[function]]
name = "BITLSHIFT"
min = 2
max = 2
returns = "integer"
flags = "excel"
description = "Shifts the first argument's integer left by ShiftAmount bits; a negative amount shifts right. Two's-complement semantics, so the result can overflow or underflow."
examples = ["BITLSHIFT ( 4, 2 )", "BITLSHIFT ( Sales[Quantity], 1 )"]
[[function.params]]
name = "Number"
kind = "Number"
[[function.params]]
name = "ShiftAmount"
kind = "Number"
[[function.signature]]
kinds = ["Number", "Number"]
variadic = false

[[function]]
name = "BITRSHIFT"
min = 2
max = 2
returns = "integer"
flags = "excel"
description = "Shifts the first argument's integer right by ShiftAmount bits; a negative amount shifts left. Two's-complement semantics, so the result can overflow or underflow."
examples = ["BITRSHIFT ( 8, 2 )", "BITRSHIFT ( Sales[Quantity], 1 )"]
[[function.params]]
name = "Number"
kind = "Number"
[[function.params]]
name = "ShiftAmount"
kind = "Number"
[[function.signature]]
kinds = ["Number", "Number"]
variadic = false

[[function]]
name = "BLANK"
min = 0
max = 0
returns = "blank"
flags = "excel"
description = "Returns the BLANK value. BLANK has no data type and is converted automatically when compared with other values; use the `==` operator or ISBLANK to test for it."
examples = ["BLANK ()"]
[[function.signature]]
kinds = []
variadic = false

[[function]]
name = "EARLIER"
min = 1
max = 2
returns = "any"
flags = "discouraged"
description = "Returns the value of a column in an outer row context, `Number` evaluation passes back (default 1). Fails when no outer row context exists. dax.guide marks it not recommended: a variable captured before the inner row context is easier to read and maintain."
examples = ["EARLIER ( Customer[Yearly Income] )", "EARLIER ( Customer[Yearly Income], 1 )"]
[[function.params]]
name = "ColumnName"
kind = "Column"
[[function.params]]
name = "Number"
kind = "Number"
optional = true
[[function.signature]]
kinds = ["Column"]
variadic = false
[[function.signature]]
kinds = ["Column", "Number"]
variadic = false

[[function]]
name = "EARLIEST"
min = 1
max = 1
returns = "any"
flags = "discouraged"
description = "Returns the value of a column in the outermost row context, equivalent to EARLIER with the largest possible scan count. dax.guide marks it not recommended in favour of storing the value in a variable."
examples = ["EARLIEST ( Customer[Yearly Income] )"]
[[function.params]]
name = "ColumnName"
kind = "Column"
[[function.signature]]
kinds = ["Column"]
variadic = false

[[function]]
name = "ERROR"
min = 1
max = 1
returns = "variant"
flags = "excel"
description = "Stops evaluation and raises a user-specified error with the supplied message. It can be used anywhere a scalar is expected, but has no data type of its own, so wrap it in CONVERT to give the surrounding expression a concrete type."
examples = ["ERROR ( \"Missing inflation rate\" )"]
[[function.params]]
name = "ErrorText"
kind = "Text"
[[function.signature]]
kinds = ["Text"]
variadic = false

[[function]]
name = "EXTERNALMEASURE"
min = 1
max = 3
returns = "any"
flags = "engine"
description = "Invokes a measure defined in a remote model. The optional type name (BOOLEAN/LOGICAL, CURRENCY/DECIMAL, DATETIME, DOUBLE, INTEGER/INT64, STRING/TEXT, VARIANT) declares the remote result type and the optional data source names the external model. Power BI generates these calls for composite models."
examples = ["EXTERNALMEASURE ( \"Remote Sales\", \"DOUBLE\", \"RemoteModel\" )"]
[[function.params]]
name = "MeasureName"
kind = "Text"
[[function.params]]
name = "Type"
kind = "Text"
optional = true
[[function.params]]
name = "Datasource"
kind = "Text"
optional = true
[[function.signature]]
kinds = ["Text"]
variadic = false
[[function.signature]]
kinds = ["Text", "Text"]
variadic = false
[[function.signature]]
kinds = ["Text", "Text", "Text"]
variadic = false

[[function]]
name = "HASH"
min = 1
max = 0
max_open = true
returns = "integer"
flags = "visual"
description = "Fingerprints a variable number of input expressions with a hash and returns an integer. The function appears in the engine metadata but is not documented by Microsoft, so its exact hash algorithm and stability across versions are unspecified."
examples = ["HASH ( Sales[Amount] )", "HASH ( Sales[OrderNumber], Sales[LineNumber] )"]
[[function.params]]
name = "Expression"
kind = "Any"
[[function.signature]]
kinds = ["Any"]
variadic = true

[[function]]
name = "INFO.STORAGETABLES"
min = 0
max = 0
max_open = true
returns = "table"
flags = "visual"
description = "Returns statistics about the in-memory storage tables of the model, with one row per table and columns such as DATABASE_NAME, TABLE_ID, TABLE_PARTITIONS_COUNT and ROWS_COUNT. It corresponds to the DISCOVER_STORAGE_TABLES dynamic management view, accepts optional restriction name/value pairs, and, like every INFO function, cannot be used in calculated tables or calculated columns."
examples = ["INFO.STORAGETABLES ()", "INFO.STORAGETABLES ( \"DATABASE_NAME\", \"Sales\" )"]
[[function.params]]
name = "RestrictionName"
kind = "Text"
optional = true
[[function.params]]
name = "RestrictionValue"
kind = "Any"
optional = true
[[function.signature]]
kinds = []
variadic = false
[[function.signature]]
kinds = ["Text"]
variadic = false
[[function.signature]]
kinds = ["Text", "Any"]
variadic = true

