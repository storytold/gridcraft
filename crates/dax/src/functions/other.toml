[[function]]
name = "SAMPLECARTESIANPOINTSBYCOVER"
min = 4
max = 7
returns = "table"
flags = "visual"
description = "Returns a sample of at most `Size` rows from a table, chosen by plotting each row as a point on the X and Y coordinates and then dropping overlapping points. The optional Radius column controls point size, MaxMinRatio limits the ratio between the largest and smallest drawn points, and MaxBlankRatio limits the ratio between the largest point and those with a blank radius. The function is used by the engine's scatter chart sampling and is not documented by Microsoft."
examples = ["SAMPLECARTESIANPOINTSBYCOVER ( 1000, Sales, Sales[Longitude], Sales[Latitude] )", "SAMPLECARTESIANPOINTSBYCOVER ( 1000, Sales, Sales[X], Sales[Y], Sales[Radius], 4, 0.1 )"]
[[function.params]]
name = "Size"
kind = "Number"
[[function.params]]
name = "Table"
kind = "Table"
[[function.params]]
