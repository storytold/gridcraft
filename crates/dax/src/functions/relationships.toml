# RelationshipManagement functions — declarative catalog data, one row per function.
# Loaded by the shared `catalog` module; see its docs for the schema.

[[function]]
name = "CROSSFILTER"
min = 3
max = 3
returns = "any"
flags = "standard"
description = "Overrides the cross-filter direction of an existing relationship for the duration of the filter context it modifies. The two column arguments identify the relationship endpoints; the third argument is NONE, ONEWAY, BOTH, ONEWAY_LEFTFILTERSRIGHT or ONEWAY_RIGHTFILTERSLEFT, in words or numbers. The `ONEWAY_*` spellings name their sides by the argument order, with the first column on the left. It changes only the propagation direction, never which relationship is active, so it is used as a filter modifier inside CALCULATE and similar functions and returns no value."
examples = ["CALCULATE ( [Sales Amount], CROSSFILTER ( Sales[CustomerKey], Customer[CustomerKey], BOTH ) )", "CALCULATE ( COUNTROWS ( Customer ), CROSSFILTER ( Sales[ProductKey], 'Product'[ProductKey], NONE ) )", "CALCULATE ( [Sales Amount], CROSSFILTER ( Sales[CustomerKey], Customer[CustomerKey], 1 ) )"]
[[function.params]]
name = "LeftColumnName"
kind = "Column"
[[function.params]]
name = "RightColumnName"
kind = "Column"
[[function.params]]
name = "CrossFilterType"
kind = "Any"
[[function.signature]]
kinds = ["Column", "Column", "Any"]
variadic = false

[[function]]
name = "RELATED"
min = 1
max = 1
returns = "any"
flags = "standard"
description = "Returns the value of a column on the one side of a many-to-one relationship, following one or more regular relationships from the current row. It requires a row context and an active regular relationship, so it is used in calculated columns and inside table iterators; a limited relationship cannot be traversed. The result is BLANK when no related row exists and the column value can be of any type."
examples = ["SUMX ( Sales, Sales[Quantity] * RELATED ( 'Product'[List Price] ) )", "RELATED ( 'Product'[Category] )", "RELATED ( Customer[CountryRegion] )"]
[[function.params]]
name = "ColumnName"
kind = "Column"
[[function.signature]]
kinds = ["Column"]
variadic = false

[[function]]
name = "RELATEDTABLE"
min = 1
max = 1
returns = "table"
flags = "standard"
description = "Returns the rows of a table on the many side of a relationship, filtered to the rows related to the current row. It performs a context transition from the row context to a filter context before evaluating the table, making it a shortcut for CALCULATETABLE with no additional filters; unlike CALCULATETABLE it accepts only a table reference, not an arbitrary table expression."
examples = ["AVERAGEX ( Customer, COUNTROWS ( RELATEDTABLE ( Sales ) ) )", "RELATEDTABLE ( Sales )", "COUNTROWS ( RELATEDTABLE ( OrderLines ) )"]
[[function.params]]
name = "Table"
kind = "Table"
[[function.signature]]
kinds = ["Table"]
variadic = false

[[function]]
name = "USERELATIONSHIP"
min = 2
max = 2
returns = "any"
flags = "standard"
description = "Activates an existing relationship for the duration of the filter context it modifies, so its filters propagate even when the relationship is inactive in the model. The two column arguments are the relationship endpoints; the innermost USERELATIONSHIP wins in nested CALCULATE expressions. It selects which relationship propagates filters, not their cross-filter direction, and returns no value."
examples = ["CALCULATE ( [Sales Amount], USERELATIONSHIP ( Sales[Delivery Date], 'Date'[Date] ) )", "CALCULATE ( COUNTROWS ( Sales ), USERELATIONSHIP ( Sales[Order Date], 'Date'[Date] ) )"]
[[function.params]]
name = "ColumnName1"
kind = "Column"
[[function.params]]
name = "ColumnName2"
kind = "Column"
[[function.signature]]
kinds = ["Column", "Column"]
variadic = false
