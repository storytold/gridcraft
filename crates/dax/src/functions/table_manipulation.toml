kinds = ["Table"]
variadic = false
[[function.signature]]
kinds = ["Table", "Reference"]
variadic = false
[[function.signature]]
kinds = ["Table", "Reference", "Any"]
variadic = true

[[function]]
name = "SUMMARIZECOLUMNS"
min = 0
max = 0
max_open = true
returns = "table"
flags = "excel"
description = "Builds a summary table from group-by columns, filters applied only to the grouping, and added expression columns. A row is included only when at least one expression returns a non-blank value; filters accept KEEPFILTERS, REMOVEFILTERS and NONVISUAL, and group-by arguments accept ROLLUPGROUP and ROLLUPADDISSUBTOTAL. Since June 2024 it can run inside context transition, with the remaining limitations documented by Microsoft."
examples = ["SUMMARIZECOLUMNS ( Sales[Region], \"Amount\", SUM ( Sales[Amount] ) )", "SUMMARIZECOLUMNS ( 'Product'[Brand], 'Date'[Calendar Year], \"Amount\", [Sales Amount] )"]
