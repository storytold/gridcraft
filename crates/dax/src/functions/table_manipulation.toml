variadic = true

[[function]]
name = "SUMMARIZE"
min = 1
max = 0
max_open = true
returns = "table"
flags = "excel"
description = "Groups the input table by the given columns and optionally adds computed columns. The group-by arguments can be columns of the table or its related tables, or ROLLUP / ROLLUPGROUP calls. Adding columns with SUMMARIZE is deprecated in favour of SUMMARIZECOLUMNS or ADDCOLUMNS, and ROLLUP/ROLLUPGROUP columns lose their data lineage."
examples = ["SUMMARIZE ( Sales, Sales[Region], \"Amount\", SUM ( Sales[Amount] ) )", "SUMMARIZE ( Sales, 'Product'[Brand], 'Date'[Calendar Year] )"]
[[function.params]]
name = "Table"
kind = "Table"
