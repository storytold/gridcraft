# TableManipulation functions — declarative catalog data, one row per function.
# Loaded by the shared `catalog` module; see its docs for the schema.

[[function]]
name = "ADDCOLUMNS"
min = 3
max = 0
max_open = true
returns = "table"
flags = "iterator-excel"
description = "Returns the input table with new columns added. Each expression is evaluated in the row context of the table, so the expressions are repeatable in `Name, Expression` pairs. The added columns keep the data lineage of a simple column reference for NATURALINNERJOIN/NATURALLEFTOUTERJOIN but not for context transition."
examples = ["ADDCOLUMNS ( Sales, \"Margin\", Sales[Amount] - Sales[Cost] )", "ADDCOLUMNS ( Product, \"Brand\", Product[Brand], \"Price\", Product[List Price] )"]
[[function.params]]
name = "Table"
kind = "Table"
[[function.params]]
name = "Name"
kind = "Text"
[[function.params]]
name = "Expression"
kind = "Expression"
[[function.signature]]
kinds = ["Table", "Text", "Expression"]
variadic = true

[[function]]
name = "ADDMISSINGITEMS"
min = 1
max = 0
max_open = true
returns = "table"
flags = "excel"
description = "Adds back the rows of a SUMMARIZECOLUMNS result that were removed because every measure was blank. The optional leading columns list which columns must show all items; the table argument is the SUMMARIZECOLUMNS result, followed by optional group-by columns (possibly ROLLUPGROUP/ROLLUPADDISSUBTOTAL calls) and filters. ROLLUPISSUBTOTAL marks the subtotal columns."
examples = ["ADDMISSINGITEMS ( Sales[Region], SUMMARIZECOLUMNS ( Sales[Region], \"Amount\", SUM ( Sales[Amount] ) ), Sales[Region] )"]
[[function.params]]
name = "ShowAll_ColumnName"
kind = "Column"
optional = true
[[function.params]]
name = "Table"
kind = "Table"
[[function.params]]
name = "GroupBy_ColumnName"
kind = "Any"
optional = true
[[function.params]]
name = "FilterTable"
kind = "Table"
optional = true
[[function.signature]]
kinds = ["Table"]
variadic = false
[[function.signature]]
kinds = ["Any"]
variadic = true

[[function]]
name = "CROSSJOIN"
min = 1
max = 0
max_open = true
returns = "table"
flags = "excel"
description = "Returns the Cartesian product of the table arguments. The result has the product of the row counts and the sum of the column counts; column names must be different in every argument or the function raises an error."
examples = ["CROSSJOIN ( Product, Store )", "CROSSJOIN ( Product, Store, 'Date' )"]
[[function.params]]
name = "Table"
kind = "Table"
[[function.signature]]
kinds = ["Table"]
variadic = true

[[function]]
name = "CURRENTGROUP"
min = 0
max = 0
returns = "table"
flags = "excel"
description = "Returns the subset of rows of the GROUPBY input table that belong to the current group. It takes no arguments and is only valid as the table argument of an aggregation iterator inside GROUPBY, such as SUMX or COUNTX."
examples = ["GROUPBY ( Sales, Sales[Region], \"Amount\", SUMX ( CURRENTGROUP (), Sales[Amount] ) )"]
[[function.signature]]
kinds = []
variadic = false

[[function]]
name = "DATATABLE"
min = 3
max = 0
max_open = true
returns = "table"
flags = "excel"
description = "Returns a table whose columns and rows are declared inline. Column names and data type names alternate, followed by a single table constructor with the data. Data type names are BOOLEAN/LOGICAL, CURRENCY/DECIMAL, DATETIME, DOUBLE, INTEGER/INT64 and STRING/TEXT; unlike the table constructor, DATATABLE requires literal values."
examples = ["DATATABLE ( \"Name\", STRING, { { \"Small\", 1 }, { \"Medium\", 2 } } )", "DATATABLE ( \"Name\", STRING, \"Ordinal\", INTEGER, { { \"Small\", 1 }, { \"Large\", 3 } } )"]
[[function.params]]
name = "Name"
kind = "Text"
[[function.params]]
name = "DataType"
kind = "Text"
[[function.params]]
name = "Data"
kind = "Any"
[[function.signature]]
kinds = ["Text", "Text", "Any"]
variadic = true

[[function]]
name = "DETAILROWS"
min = 1
max = 1
returns = "table"
flags = "excel"
description = "Returns the table produced by the DetailRows expression defined on a measure. When the measure has no DetailRows expression, the entire table the measure belongs to is returned. Context transition is not applied by the engine; wrap the call in CALCULATETABLE inside a row context when transition is intended."
examples = ["DETAILROWS ( [Sales Amount] )"]
[[function.params]]
name = "Measure"
kind = "Reference"
[[function.signature]]
kinds = ["Reference"]
variadic = false

[[function]]
name = "DISTINCT"
min = 1
max = 1
returns = "table"
flags = "excel"
description = "Returns the distinct values of a column, or the distinct rows of a table expression. Unlike VALUES, a column argument does not add the blank row generated by an invalid relationship."
examples = ["DISTINCT ( Sales[Region] )", "DISTINCT ( Sales )"]
[[function.params]]
name = "ColumnNameOrTableExpr"
kind = "Reference"
[[function.signature]]
kinds = ["Column"]
variadic = false
[[function.signature]]
kinds = ["Table"]
variadic = false

[[function]]
name = "EXCEPT"
min = 2
max = 2
returns = "table"
flags = "excel"
description = "Returns the rows of the left table that do not appear in the right table. A row present in both tables is removed together with its duplicates; columns are matched by position with strict comparison and the result keeps the left table's column names and lineage."
examples = ["EXCEPT ( Sales, SalesArchive )"]
[[function.params]]
name = "LeftTable"
kind = "Table"
[[function.params]]
name = "RightTable"
kind = "Table"
[[function.signature]]
kinds = ["Table", "Table"]
variadic = false

[[function]]
name = "FILTERS"
min = 1
max = 1
returns = "table"
flags = "excel"
description = "Returns the filter values applied directly to a column, as a single-column table. The column argument must be a column reference; the result can include the blank row generated by an invalid relationship."
examples = ["FILTERS ( Store[Continent] )", "FILTERS ( 'Date'[Calendar Year] )"]
[[function.params]]
name = "ColumnName"
kind = "Column"
[[function.signature]]
kinds = ["Column"]
variadic = false

[[function]]
name = "GENERATE"
min = 2
max = 2
returns = "table"
flags = "iterator-excel"
description = "Evaluates the second table expression for every row of the first table and returns the union of those results with the corresponding first-table columns. Rows of the first table whose second expression is empty are dropped, unlike GENERATEALL."
examples = ["GENERATE ( Product, RELATEDTABLE ( Sales ) )"]
[[function.params]]
name = "Table1"
kind = "Table"
[[function.params]]
name = "Table2"
kind = "Table"
[[function.signature]]
kinds = ["Table", "Table"]
variadic = false

[[function]]
name = "GENERATEALL"
min = 2
max = 2
returns = "table"
flags = "iterator-excel"
description = "Evaluates the second table expression for every row of the first table and keeps the first-table row even when that expression is empty, filling the second table's columns with blanks. Column names must be different in both arguments."
examples = ["GENERATEALL ( Product, RELATEDTABLE ( Sales ) )"]
[[function.params]]
name = "Table1"
kind = "Table"
[[function.params]]
name = "Table2"
kind = "Table"
[[function.signature]]
kinds = ["Table", "Table"]
variadic = false

[[function]]
name = "GENERATESERIES"
min = 2
max = 3
returns = "table"
flags = "excel"
description = "Returns a single-column table named Value holding an arithmetic series from StartValue to EndValue. IncrementValue must be positive and defaults to 1; the series stops at the last value less than or equal to EndValue, and EndValue below StartValue yields an empty table."
examples = ["GENERATESERIES ( 1, 10, 2 )", "GENERATESERIES ( DATE ( 2024, 1, 1 ), DATE ( 2024, 12, 31 ) )"]
[[function.params]]
name = "StartValue"
kind = "Number"
[[function.params]]
name = "EndValue"
kind = "Number"
[[function.params]]
name = "IncrementValue"
kind = "Number"
optional = true
[[function.signature]]
kinds = ["Number", "Number"]
variadic = false
[[function.signature]]
kinds = ["Number", "Number", "Number"]
variadic = false

[[function]]
name = "GROUPBY"
min = 1
max = 0
max_open = true
returns = "table"
flags = "excel"
description = "Groups the input table by the given columns and adds expression columns evaluated per group. Expressions added by GROUPBY must aggregate CURRENTGROUP() and cannot use CALCULATE; use SUMMARIZE when the added columns aggregate base-table columns."
examples = ["GROUPBY ( Sales, Sales[Region], \"Amount\", SUMX ( CURRENTGROUP (), Sales[Amount] ) )", "GROUPBY ( Customer, Customer[Country] )"]
[[function.params]]
name = "Table"
kind = "Table"
[[function.params]]
name = "GroupBy_ColumnName"
kind = "Column"
optional = true
[[function.params]]
name = "Name"
kind = "Text"
optional = true
[[function.params]]
name = "Expression"
kind = "Expression"
optional = true
[[function.signature]]
kinds = ["Table"]
variadic = false
[[function.signature]]
kinds = ["Table", "Column"]
variadic = false
[[function.signature]]
kinds = ["Table", "Any", "Any"]
variadic = true

[[function]]
name = "IGNORE"
min = 1
max = 1
returns = "blank"
flags = "excel"
description = "Marks a SUMMARIZECOLUMNS expression so that it is excluded when deciding whether a row is blank. Rows are kept as long as another expression without IGNORE returns a value; the function itself returns no value."
examples = ["SUMMARIZECOLUMNS ( Sales[Region], IGNORE ( [Sales Amount] ) )"]
[[function.params]]
name = "Measure_Expression"
kind = "Any"
[[function.signature]]
kinds = ["Any"]
variadic = false

[[function]]
name = "INTERSECT"
min = 2
max = 2
returns = "table"
flags = "excel"
description = "Returns the rows of the left table that also appear in the right table, keeping duplicates from the left table. Columns are matched by position without type coercion; the operation is not commutative and the result keeps the left table's column names and lineage."
examples = ["INTERSECT ( Sales, SalesArchive )"]
[[function.params]]
name = "LeftTable"
kind = "Table"
[[function.params]]
name = "RightTable"
kind = "Table"
[[function.signature]]
kinds = ["Table", "Table"]
variadic = false

[[function]]
name = "NATURALINNERJOIN"
min = 2
max = 2
returns = "table"
flags = "excel"
description = "Joins two tables on all columns they have in common (including columns of their expanded tables) and returns the matching rows. Joined columns must have the same name, data type and lineage; comparison is strict, with no type coercion."
examples = ["NATURALINNERJOIN ( Sales, Product )"]
[[function.params]]
name = "LeftTable"
kind = "Table"
[[function.params]]
name = "RightTable"
kind = "Table"
[[function.signature]]
kinds = ["Table", "Table"]
variadic = false

[[function]]
name = "NATURALJOINUSAGE"
min = 1
max = 1
returns = "table"
flags = "engine"
description = "Adds a table as a natural join to the filter context. It is only valid as a value filter of SUMMARIZECOLUMNS and is used mostly in queries sent to composite models; dax.guide lists no Excel support and Microsoft documentation is not available."
examples = ["SUMMARIZECOLUMNS ( Sales[Region], NATURALJOINUSAGE ( Product ) )"]
[[function.params]]
name = "Expression"
kind = "Any"
[[function.signature]]
kinds = ["Any"]
variadic = false

[[function]]
name = "NATURALLEFTOUTERJOIN"
min = 2
max = 2
returns = "table"
flags = "excel"
description = "Joins two tables on all columns they have in common and returns every row of the left table, with blanks where the right table has no match. Joined columns must share name, data type and lineage, and comparison does not coerce types."
examples = ["NATURALLEFTOUTERJOIN ( Sales, Product )"]
[[function.params]]
name = "LeftTable"
kind = "Table"
[[function.params]]
name = "RightTable"
kind = "Table"
[[function.signature]]
kinds = ["Table", "Table"]
variadic = false

[[function]]
name = "NONVISUAL"
min = 1
max = 1
returns = "table"
flags = "excel"
description = "Marks a SUMMARIZECOLUMNS value filter as non-visual: the filter still restricts the grouping columns but does not affect measure values, so measures that use ALLSELECTED can return the non-visual totals."
examples = ["SUMMARIZECOLUMNS ( 'Date'[Calendar Year], NONVISUAL ( TREATAS ( { \"CY 2008\" }, 'Date'[Calendar Year] ) ), \"Amount\", [Sales Amount] )"]
[[function.params]]
name = "Expression"
kind = "Table"
[[function.signature]]
kinds = ["Table"]
variadic = false

[[function]]
name = "ROLLUP"
min = 1
max = 0
max_open = true
returns = "blank"
flags = "excel"
description = "Identifies the SUMMARIZE group-by columns that also produce subtotal rows. The arguments must be qualified column names, not expressions, and are only valid inside SUMMARIZE; the function itself returns no value."
examples = ["SUMMARIZE ( Sales, ROLLUP ( Sales[Country], Sales[City] ), \"Amount\", SUM ( Sales[Amount] ) )"]
[[function.params]]
name = "GroupBy_ColumnName"
kind = "Column"
[[function.signature]]
kinds = ["Any"]
variadic = true

[[function]]
name = "ROLLUPADDISSUBTOTAL"
min = 2
max = 0
max_open = true
returns = "blank"
flags = "excel"
description = "Identifies the SUMMARIZECOLUMNS group-by columns that produce subtotals and adds a Boolean column per pair indicating whether the row is a subtotal. It accepts an optional grand-total filter before the pairs and an optional per-level filter after each pair; it is only valid inside SUMMARIZECOLUMNS and returns no value."
examples = ["SUMMARIZECOLUMNS ( ROLLUPADDISSUBTOTAL ( Sales[Country], \"IsSubtotal Country\" ), \"Amount\", SUM ( Sales[Amount] ) )"]
[[function.params]]
name = "GrandtotalFilter"
kind = "Table"
optional = true
[[function.params]]
name = "GroupBy_ColumnName"
kind = "Column"
[[function.params]]
name = "Name"
kind = "Text"
[[function.params]]
name = "GroupLevelFilter"
kind = "Table"
optional = true
[[function.signature]]
kinds = ["Any", "Any"]
variadic = true

[[function]]
name = "ROLLUPGROUP"
min = 1
max = 0
max_open = true
returns = "blank"
flags = "excel"
description = "Identifies a group of SUMMARIZE or SUMMARIZECOLUMNS columns that produce subtotals together. Inside ROLLUP it suppresses the partial subtotals that ROLLUP would otherwise add; the function itself returns no value."
examples = ["SUMMARIZE ( Sales, ROLLUPGROUP ( Sales[Country], Sales[City] ), \"Amount\", SUM ( Sales[Amount] ) )"]
[[function.params]]
name = "GroupBy_ColumnName"
kind = "Column"
[[function.signature]]
kinds = ["Column"]
variadic = true

[[function]]
name = "ROLLUPISSUBTOTAL"
min = 2
max = 0
max_open = true
returns = "blank"
flags = "excel"
description = "Pairs the subtotal columns created by ROLLUPADDISSUBTOTAL with their group-by columns so that ADDMISSINGITEMS can add the missing subtotal rows. It is only valid inside ADDMISSINGITEMS and returns no value."
examples = ["ADDMISSINGITEMS ( Sales[Country], SUMMARIZECOLUMNS ( ROLLUPADDISSUBTOTAL ( Sales[Country], \"IsSubtotal\" ), \"Amount\", SUM ( Sales[Amount] ) ), ROLLUPISSUBTOTAL ( Sales[Country], [IsSubtotal] ) )"]
[[function.params]]
name = "GrandtotalFilter"
kind = "Table"
optional = true
[[function.params]]
name = "GroupBy_ColumnName"
kind = "Column"
[[function.params]]
name = "IsSubtotal_ColumnName"
kind = "Text"
[[function.params]]
name = "GroupLevelFilter"
kind = "Table"
optional = true
[[function.signature]]
kinds = ["Any", "Any"]
variadic = true

[[function]]
name = "ROW"
min = 2
max = 0
