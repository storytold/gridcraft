[[function]]
name = "VALUES"
min = 1
max = 1
returns = "table"
flags = "excel"
description = "With a column, returns its unique values as a single-column table, including the blank row produced by an invalid relationship. With a table name it returns every row of that table with its columns unchanged, without removing duplicates. VALUES needs a model table or column, so it cannot be applied to a variable."
examples = ["VALUES ( Sales[Region] )", "VALUES ( Store )"]
[[function.params]]
name = "TableNameOrColumnName"
kind = "Reference"
[[function.signature]]
kinds = ["Column"]
variadic = false
[[function.signature]]
kinds = ["Table"]
variadic = false
