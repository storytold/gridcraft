[[function]]
name = "SUBSTITUTEWITHINDEX"
min = 4
max = 0
max_open = true
returns = "table"
flags = "iterator-excel"
description = "Semijoins two tables and replaces the common columns with a zero-based index column. The index follows the row order obtained by sorting the second table with the supplied order expressions; matching uses the same lineage rules as the natural joins and raises an error when no column matches."
