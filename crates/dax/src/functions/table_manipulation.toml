[[function]]
name = "SELECTCOLUMNS"
min = 1
max = 0
max_open = true
returns = "table"
flags = "iterator-excel"
description = "Projects the input to one column per `Name, Expression` pair, keeping the same row count; each expression is evaluated in row context. Unlike ADDCOLUMNS it starts from an empty table; the name may be omitted when the expression is a simple column reference, and simple references keep their data lineage."
examples = ["SELECTCOLUMNS ( Sales, \"Amount\", Sales[Amount] )", "SELECTCOLUMNS ( Product, \"Brand\", Product[Brand], \"Category\", Product[Category] )"]
