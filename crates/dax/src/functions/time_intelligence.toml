[[function]]
name = "CLOSINGBALANCEMONTH"
min = 2
max = 3
returns = "any"
flags = "excel"
description = "Evaluates the expression at the last date of the current month, after applying the optional filter. It opens a month-to-date window only at its closing date, so a filter on the date table is replaced by ENDOFMONTH; the date table must be contiguous and marked as a date table for the relationship to be treated as a calendar."
examples = ["CLOSINGBALANCEMONTH ( [Sales Amount], 'Date'[Date] )"]
[[function.params]]
name = "Expression"
kind = "Expression"
[[function.params]]
name = "Dates"
kind = "Date"
[[function.params]]
name = "Filter"
kind = "Any"
optional = true
[[function.signature]]
kinds = ["Expression", "Date"]
variadic = false
[[function.signature]]
kinds = ["Expression", "Date", "Any"]
variadic = false

