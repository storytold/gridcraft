[[function]]
name = "STARTOFYEAR"
min = 1
max = 2
returns = "table"
flags = "excel"
description = "Returns the first date of the year visible in the filter context as a single-row table. YearEndDate shifts the start to a fiscal year; the date table must be marked and include every day from the fiscal-year start through year end."
examples = ["STARTOFYEAR ( 'Date'[Date] )", "STARTOFYEAR ( 'Date'[Date], \"6/30/2008\" )"]
