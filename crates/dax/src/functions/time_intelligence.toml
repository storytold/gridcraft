[[function]]
name = "DATEADD"
min = 3
max = 5
returns = "table"
flags = "excel"
description = "Shifts the dates visible in the filter context by NumberOfIntervals units of Interval (DAY, MONTH, QUARTER or YEAR) and returns the dates that exist in the date column. Extension and Truncation are available only for a model calendar; for a date column DATEADD accepts exactly three arguments. With a calendar, YEAR follows the calendar's year definition, which may be a fiscal year."
examples = ["DATEADD ( 'Date'[Date], -1, YEAR )", "DATEADD ( Gregorian, 1, MONTH )", "DATEADD ( Gregorian, 1, MONTH, EXTENDING, ANCHORED )"]
[[function.params]]
name = "Dates"
kind = "Date"
[[function.params]]
name = "NumberOfIntervals"
kind = "Number"
[[function.params]]
name = "Interval"
kind = "Text"
[[function.params]]
name = "Extension"
kind = "Text"
optional = true
[[function.params]]
name = "Truncation"
kind = "Text"
optional = true
[[function.signature]]
kinds = ["Date", "Number", "Text"]
variadic = false
[[function.signature]]
kinds = ["Date", "Number", "Text", "Text"]
variadic = false
[[function.signature]]
kinds = ["Date", "Number", "Text", "Text", "Text"]
variadic = false

[[function]]
name = "DATESBETWEEN"
min = 3
max = 3
returns = "table"
flags = "excel"
description = "Returns the dates between two inclusive boundaries that exist in the date column. A BLANK StartDate begins at MIN ( Dates ), a BLANK EndDate ends at MAX ( Dates ), and a StartDate after EndDate returns an empty table. The result keeps the lineage of the marked date table, so the date table must be contiguous for windows to be meaningful."
examples = ["DATESBETWEEN ( 'Date'[Date], DATE ( 2008, 8, 1 ), DATE ( 2008, 8, 31 ) )"]
[[function.params]]
name = "Dates"
kind = "Date"
[[function.params]]
name = "StartDate"
kind = "Date"
[[function.params]]
name = "EndDate"
kind = "Date"
[[function.signature]]
kinds = ["Date", "Date", "Date"]
variadic = false

[[function]]
name = "DATESINPERIOD"
min = 4
max = 5
returns = "table"
flags = "excel"
description = "Returns the dates from StartDate over NumberOfIntervals units of Interval (DAY, WEEK, MONTH, QUARTER or YEAR); a negative count looks backwards. BLANK StartDate uses the minimum date in the column. EndBehavior (PRECISE or ENDALIGNED) is available only with a model calendar; consider WINDOW when the interval arithmetic is not needed."
examples = ["DATESINPERIOD ( 'Date'[Date], MAX ( 'Date'[Date] ), -12, MONTH )", "DATESINPERIOD ( Gregorian, DATE ( 2008, 2, 29 ), -1, MONTH, ENDALIGNED )"]
