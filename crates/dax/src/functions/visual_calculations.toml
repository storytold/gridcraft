[[function]]
name = "EXPANDALL"
min = 1
max = 2
returns = "any"
flags = "visual"
description = "Adds every detail level along an axis, returning the expression evaluated at the lowest level of that axis. The inverse of COLLAPSEALL. Available only in Power BI visual calculations."
examples = ["EXPANDALL ( [Sales Amount], ROWS )", "EXPANDALL ( ROWS )", "EXPANDALL ( [Sales Amount], COLUMNS )"]
