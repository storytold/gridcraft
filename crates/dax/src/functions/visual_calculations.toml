min = 2
max = 7
returns = "numeric"
flags = "visual"
description = "Calculates the average of the values in a sliding window of WindowSize rows along an axis. IncludeCurrent defaults to TRUE; when FALSE the window holds the previous WindowSize rows. OrderBy, Blanks and Reset behave as in FIRST. Available only in Power BI visual calculations."
