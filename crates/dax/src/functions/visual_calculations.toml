# VisualCalculations functions — declarative catalog data, one row per function.
# Loaded by the shared `catalog` module; see its docs for the schema.

[[function]]
name = "COLLAPSE"
min = 1
max = 0
max_open = true
returns = "any"
flags = "visual"
description = "Retrieves a context with the detail levels above the current one removed, or returns its first argument evaluated in that coarser context. Navigation-only calls (an axis or a list of columns) can be used inside CALCULATE. Available only in Power BI visual calculations; `N` defaults to one level."
examples = ["COLLAPSE ( [Sales Amount], ROWS )", "COLLAPSE ( [Sales Amount], ROWS, 2 )", "COLLAPSE ( [Sales Amount], [Month] )", "COLLAPSE ( ROWS, 1 )"]
[[function.params]]
name = "Expression"
kind = "Any"
[[function.params]]
name = "Axis"
kind = "Any"
optional = true
[[function.params]]
name = "Column"
kind = "Column"
optional = true
[[function.params]]
name = "N"
kind = "Number"
optional = true
[[function.signature]]
kinds = ["Any"]
variadic = false
[[function.signature]]
kinds = ["Any", "Any"]
variadic = true

[[function]]
name = "COLLAPSEALL"
min = 1
max = 2
returns = "any"
flags = "visual"
description = "Removes every detail level along an axis, returning the expression evaluated at the highest level of that axis. The inverse of EXPANDALL. Available only in Power BI visual calculations."
examples = ["COLLAPSEALL ( [Sales Amount], ROWS )", "COLLAPSEALL ( ROWS )", "COLLAPSEALL ( [Sales Amount], COLUMNS )"]
[[function.params]]
name = "Expression"
kind = "Any"
optional = true
[[function.params]]
name = "Axis"
kind = "Any"
[[function.signature]]
kinds = ["Any"]
variadic = false
[[function.signature]]
kinds = ["Any", "Any"]
variadic = false

[[function]]
name = "EXPAND"
min = 1
max = 0
max_open = true
returns = "any"
flags = "visual"
