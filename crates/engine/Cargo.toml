[package]
name = "gridcraft-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GridCraft engine: sessions, commands, history, clipboard, fill, sort, filter"

[lints]
workspace = true

[dependencies]
gridcraft-core = { workspace = true }
gridcraft-numfmt = { workspace = true }
gridcraft-formula = { workspace = true }
gridcraft-functions = { workspace = true }
gridcraft-model = { workspace = true }
gridcraft-calc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
gridcraft-xlsx = { workspace = true }
gridcraft-chart = { workspace = true }
# Hunspell dictionaries installed on the system (storytold/craft-libs#30). Pinned to the commit
# of storytold/craft-libs#31 until it merges.
craft-proof = { git = "https://github.com/brzuchal/craft-libs", rev = "20dfbeb48a2c001f5b5b1b2406ae7bcceacb7f0d" }
gridcraft-pdf = { workspace = true }
image = { workspace = true }

[dev-dependencies]
gridcraft-xlsx = { workspace = true, features = ["test-support"] }
zip = { workspace = true }
