# Italiano (Italia): Excel display-language words, read from Microsoft Support pages in this language.
tag = "it-IT"
native_name = "Italiano (Italia)"
dbcs = false
bool_true = "VERO"
bool_false = "FALSO"
r1c1 = "RC"
table_items = ["#Tutti", "#Dati", "#Intestazioni", "#Totali", "#Questa riga"]
gaps = ["REPLACEB"]

[provenance]
source = "https://support.microsoft.com/it-it/excel/ (Microsoft Support, localized pages; machine-translated, ms.translationtype MT)"
retrieved = "2026-10-10"
"method" = "function names: per-page vote among <title>/<h1>, meta description, the syntax paragraph (aligned with the en-US page) and =NAME( examples; an entry needs two agreeing signals. Entries marked `reviewed` and all other tokens were decided by hand from the page evidence and the independent sources listed under [provenance.sources]. Gaps and `unsourced` keys keep the English value until a source is found."
unsourced = ["content.chart", "content.picture", "content.pivot_table", "content.blank", "content.total_of", "content.subtotal_group", "content.subtotal_grand", "content.func_count_numbers(as pivot caption)", "content.func_stddev(as caption)", "content.func_stddevp(as caption)", "content.func_var(as caption)", "content.func_varp(as caption)"]

