"method" = "function names: per-page vote among <title>/<h1>, meta description, the syntax paragraph (aligned with the en-US page) and =NAME( examples; an entry needs two agreeing signals. Entries marked `reviewed` and all other tokens were decided by hand from the page evidence and the independent sources listed under [provenance.sources]. Gaps and `unsourced` keys keep the English value until a source is found."
