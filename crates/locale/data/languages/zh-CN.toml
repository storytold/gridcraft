# 中文 (中国): Excel display-language words, read from Microsoft Support pages in this language.
tag = "zh-CN"
native_name = "中文 (中国)"
dbcs = true
bool_true = "TRUE"
bool_false = "FALSE"
r1c1 = "RC"
table_items = ["#全部", "#数据", "#标题", "#汇总", "#此行"]
