# Regional conventions (separators, dates, names, currency) equivalent to what the operating
# system supplies to Excel for this region. Codes use canonical (en-US) format letters.
tag = "ja-JP"
native_name = "日本語 (日本)"
lcid = 0x0411
decimal = "."
group = ","
list = ","
array_col = ","
array_row = ";"
date_order = "YMD"
date_sep = "/"
time_sep = ":"
short_date = "yyyy/m/d"
long_date = "yyyy\"年\"m\"月\"d\"日\""
short_time = "h:mm"
long_time = "h:mm:ss"
months = ["1月", "2月", "3月", "4月", "5月", "6月", "7月", "8月", "9月", "10月", "11月", "12月"]
