[package]
name = "gridcraft-sandbox"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GridCraft's confined launcher for helper processes: Landlock and seccomp on Linux, sandbox-exec on macOS, refused elsewhere"

[lints]
workspace = true

[dependencies]
thiserror = { workspace = true }

# The confinement layers' system calls sit behind these crates' safe APIs; GridCraft's own code
# has no `unsafe`. Exact pins: they are the security boundary.
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "=0.4.7"
seccompiler = "=0.5.0"
libc = "0.2"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
nix = { version = "=0.31.3", default-features = false, features = ["signal"] }
