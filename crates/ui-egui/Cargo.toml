[package]
name = "gridcraft-ui-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GridCraft egui frontend (Excel-style UI); swappable — nothing below depends on it"

[lints]
workspace = true

[dependencies]
# The shared capture slot (`craft_ui::capture`) and the `cloud` feature: the Open and Save
# pages, the account badge, the share dialog and the conflict modal, which every app takes from
# here rather than draws for itself (`cloud.rs` holds GridCraft's half of it). Pinned to its own
# craft-libs revision, not the one most other craft-libs crates in this workspace share (see the
# root Cargo.toml): this is the revision that merged storytold/craft-libs#160, where `cloud`
# landed in craft-ui, and bumping it on its own is what let this app pick the merge up without
# waiting on every other craft-libs crate to move too.
craft-ui = { git = "https://github.com/storytold/craft-libs", rev = "fd7232d7a3a03ca1ccfe059a8afc8391b65668f0", features = ["cloud"] }
# Vendor-neutral cloud types (Entry, Capability, the Files/Sharing contracts). No IO, no provider
# name: also buildable for the web. Same revision as craft-ui above, so the contract craft-ui's
# pages state their work through and the contract a host's backend implements are one type.
craft-cloud = { workspace = true }
gridcraft-engine = { workspace = true }
gridcraft-chart = { workspace = true }
# `monochrome_emoji_fonts` restores the Noto Emoji and emoji-icon faces that 0.37 moved behind
# this feature. The UI draws ✕, ◀, ↘ and 📋 as text; without these faces the strict kittest
# harness (and a host with no symbol font) renders them as tofu.
egui = { workspace = true, features = ["default_fonts", "monochrome_emoji_fonts"] }
egui_extras = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
image = { workspace = true }
skrifa = { workspace = true }
unicode-bidi = "=0.3.18"
web-time = { workspace = true }

# Linux only, where winit reports no system theme: the desktop portal's light/dark answer (see
# `desktop_theme.rs`). Already in the tree, with these features, through egui's own
# accessibility bus; pinned to one version so nothing is built twice.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "=5.19.0"

[dev-dependencies]
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }
epaint_default_fonts = { workspace = true }
gridcraft-xlsx = { workspace = true, features = ["test-support"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
craft-update = { workspace = true }
# The desktop's preferred language for the first-run interface language.
sys-locale = { workspace = true }
craft-window = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Read the browser's preferred language for the first-run web interface language.
web-sys = { version = "0.3", features = ["Window", "Navigator", "Performance"] }

[build-dependencies]
serde_json = { workspace = true }
toml = "1"
