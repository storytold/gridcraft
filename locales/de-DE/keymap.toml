# Tastenkombinationen für de-DE. Gleiches Format wie en-US/keymap.toml.
#
# Überschrieben werden nur Kombinationen, die die Microsoft-Seite für de-DE (teilweise maschinell übersetzt)
# in mindestens zwei Zeilen bestätigt, sowie Kombinationen, die dadurch erzwungen werden. Alle übrigen Befehle
# erben die en-US-Kombination; die Seite bestätigt unter anderem Öffnen (Strg+O), Speichern (Strg+S),
# Neu (Strg+N), Suchen (Strg+F), Ersetzen (Strg+H), Alles auswählen (Strg+A), Link (Strg+K) und Blitzvorschau
# (Strg+E) unverändert. `mac` behält die Kombinationen mit der Befehlstaste, weil die Seite sie im
# Mac-Abschnitt unverändert zeigt (Cmd+B, Cmd+I, Cmd+U, Cmd+D, Cmd+Umschalt+F, Cmd+Umschalt+K).

[shortcuts]
"home.bold" = { keys = "Cmd+Shift+F", mac = "Cmd+B", source = 'Microsoft Excel keyboard-shortcuts page, de-DE, retrieved 2026-10-10 (https://support.microsoft.com/de-de/accessibility/excel/keyboard-shortcuts-in-excel): three Windows rows for bold ("Zuweisen der Formatierung Fett", the common-shortcuts table and the formatting table "STRG+UMSCHALT+F oder STRG+2") give Ctrl+Shift+F (en-US Ctrl+B); the Mac section keeps Cmd+B' }
"home.italic" = { keys = "Cmd+Shift+K", mac = "Cmd+I", source = 'Microsoft Excel keyboard-shortcuts page, de-DE, retrieved 2026-10-10 (https://support.microsoft.com/de-de/accessibility/excel/keyboard-shortcuts-in-excel): the Windows italic rows ("STRG+UMSCHALT+K oder STRG+3") and the Excel-for-the-web rows give Ctrl+Shift+K (en-US Ctrl+I); the Mac section keeps Cmd+I' }
"home.underline" = { keys = "Cmd+Shift+U", mac = "Cmd+U", source = 'Microsoft Excel keyboard-shortcuts page, de-DE, retrieved 2026-10-10 (https://support.microsoft.com/de-de/accessibility/excel/keyboard-shortcuts-in-excel): the Windows underline row ("STRG+UMSCHALT+U oder STRG+4") and the Excel-for-the-web rows give Ctrl+Shift+U (en-US Ctrl+U), because Ctrl+U is Fill Down in this language; the Mac section keeps Cmd+U' }
"edit.fillDown" = { keys = "Cmd+U", mac = "Cmd+D", source = 'Microsoft Excel keyboard-shortcuts page, de-DE, retrieved 2026-10-10 (https://support.microsoft.com/de-de/accessibility/excel/keyboard-shortcuts-in-excel): the Windows row "Unten ausfüllen" and the Mac-section row "CMD+D oder STRG+U" give Ctrl+U (en-US Ctrl+D); Fill Right stays Ctrl+R in the same rows' }
"data.filter" = { keys = "Cmd+Shift+L", mac = "Cmd+Shift+F", source = 'Microsoft Excel keyboard-shortcuts page, de-DE, retrieved 2026-10-10 (https://support.microsoft.com/de-de/accessibility/excel/keyboard-shortcuts-in-excel): two rows "CMD+UMSCHALT+F oder STRG+UMSCHALT+L" and the AutoFilter row "STRG+UMSCHALT+L" give Ctrl+Shift+L on Windows and Linux (en-US Ctrl+Shift+F, which is bold in this language); Cmd+Shift+F stays on the Mac' }
"data.group" = { keys = "Alt+Shift+Right", mac = "Cmd+Shift+K", source = 'Microsoft Excel keyboard-shortcuts page, de-DE, retrieved 2026-10-10 (https://support.microsoft.com/de-de/accessibility/excel/keyboard-shortcuts-in-excel): the Mac rows "Gruppieren ausgewählter Zellen: Cmd+UMSCHALT+K" keep Cmd+Shift+K on the Mac; on Windows and Linux Ctrl+Shift+K is italic in this language (see home.italic), so Group moves to Alt+Shift+Right, the Excel for Windows chord for grouping (not listed on the cached de-DE page, taken from Excel for Windows behaviour)' }
"data.ungroup" = { keys = "Alt+Shift+Left", mac = "Cmd+Shift+J", source = 'Microsoft Excel keyboard-shortcuts page, de-DE, retrieved 2026-10-10 (https://support.microsoft.com/de-de/accessibility/excel/keyboard-shortcuts-in-excel): the Mac row "Aufheben der Gruppierung ausgewählter Zellen: Cmd+UMSCHALT+J" keeps Cmd+Shift+J on the Mac; on Windows and Linux Ungroup moves to Alt+Shift+Left, the counterpart of Group (see data.group; not listed on the cached de-DE page)' }
