# Keyboard shortcuts of the en-US reference language.
#
# Format: [shortcuts."<command id>"] keys = "<chord>", optional mac = "<chord>", source = "<provenance>".
# A chord is modifiers joined by '+' and a final key: `Cmd` is the platform command modifier (Ctrl on
# Windows and Linux, the Command key on macOS), `Ctrl`, `Alt` and `Shift` are literal. `mac` overrides
# `keys` on macOS only. Every command id must exist in commands.ftl; a language inherits the en-US
# entry for each id it does not list.
#
# Provenance: the chords are the ones registered by the engine commands (crates/engine/src/cmd) and
# handled by crates/ui-egui/src/ribbon.rs `shortcut`; both were read on 2026-10-10.

[shortcuts]
"file.new" = { keys = "Cmd+N", source = "engine command table" }
"file.open" = { keys = "Cmd+O", source = "engine command table" }
"file.save" = { keys = "Cmd+S", source = "engine command table" }
"file.saveAs" = { keys = "Cmd+Shift+S", source = "engine command table" }
"file.close" = { keys = "Cmd+W", source = "engine command table" }
"range.fill" = { keys = "Ctrl+Enter", source = "engine command table" }
