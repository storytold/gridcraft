# Serve the built GridCraft web app from the official nginx image: no image to build, no
# server-side code, nothing to publish to a registry.
#
#   packaging/web/package.sh                            # writes dist/web/ (index.html, hashed .js/.wasm)
#   docker compose -f packaging/docker/compose.yaml up  # then open http://localhost:8771/
#   docker compose -f packaging/docker/compose.yaml down
#
# GRIDCRAFT_WEB_DIR   folder holding index.html (default ../../dist/web, relative to this file);
#                     an unpacked gridcraft-web-<version>.zip works just as well
# GRIDCRAFT_WEB_PORT  host port to publish (default 8771, the port `trunk serve` uses)
#
# nginx/default.conf is the nginx form of the requirements in packaging/web/README.md. Note the
# HTTPS one: WebGPU and the clipboard need a secure context, so http://localhost is fine while a
# plain-HTTP LAN address serves the app with the WebGL2 fallback.
#
# The gridcraft-cli image (CLI + stdio MCP server) is a command rather than a service, so it is
# built and run on demand: see README.md in this directory.
name: gridcraft-web

services:
  web:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "${GRIDCRAFT_WEB_PORT:-8771}:80"
    volumes:
      # Read-only: the server only reads the site, and the container keeps no state.
      - "${GRIDCRAFT_WEB_DIR:-../../dist/web}:/usr/share/nginx/html:ro"
      # The whole directory, not the single file: a bind-mounted file follows the inode, so
      # editing default.conf in place would leave the container serving (or missing) the old one.
      - "./nginx:/etc/nginx/conf.d:ro"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 2s
    # nginx only reads files here: keep the container filesystem read-only and give it just the
    # two writable directories it needs (its pid file and its cache).
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - "no-new-privileges:true"
