# Static hosting for the GridCraft web build: the server settings packaging/web/README.md
# requires. packaging/docker/Dockerfile copies this file into the image at /etc/nginx/conf.d; on any
# other nginx, drop it into conf.d/ (or include it from a server block) and point `root` at the site.
#
# No Content-Security-Policy is sent. README.md ("Required server settings") has the policy the page
# needs if you add one, plus the HTTPS note: WebGPU and the clipboard only work in a secure context,
# so a plain-HTTP address serves the app with the WebGL2 fallback.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;

    # The .wasm is tens of MiB of code and compresses to roughly a third. text/html is always
    # compressed, and listing it here makes nginx log "duplicate MIME type" at startup.
    gzip on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/wasm text/javascript text/css application/json image/svg+xml;

    # Browsers refuse to stream-compile a .wasm served under any other type, and an nginx whose
    # mime.types predates the type (or, for .js, still says the deprecated application/javascript)
    # would do exactly that. Both locations declare their type outright instead of inheriting one.
    # Asset names carry a content hash, so they can be cached forever; the page that points at
    # them (below) can not.
    location ~* \.wasm$ {
        types {
            application/wasm wasm;
        }
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ~* \.js$ {
        types {
            text/javascript js;
        }
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # A new release only changes index.html, so this one file has to be revalidated. Everything
    # else the build ships (icons, the sample .htaccess/_headers, HOSTING.md) is served as-is.
    location = /index.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-cache" always;
    }
}
