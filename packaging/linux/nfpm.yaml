# .deb and .rpm packages (nfpm: https://nfpm.goreleaser.com). Run by package.sh, which stages
# the file tree, substitutes its path for ${STAGE} (nfpm doesn't expand env vars in `src`) and
# exports VERSION and NFPM_ARCH.
#
#   nfpm package -f packaging/linux/nfpm.yaml -p deb -t dist/release/
name: gridcraft
arch: ${NFPM_ARCH}
platform: linux
version: ${VERSION}
# semver: 0.2.0-rc.1 becomes 0.2.0~rc.1 in deb/rpm, so pre-releases sort before the release.
version_schema: semver
release: 1
section: misc
priority: optional
maintainer: ${GRIDCRAFT_MAINTAINER}
vendor: Learning Machines LLC
homepage: https://getartcraft.com/apps/gridcraft
license: MIT OR Apache-2.0
description: |-
  Open-source, native spreadsheet that works the way Excel users expect.
  Opens and saves .xlsx workbooks and CSV/TSV files; hundreds of worksheet
  functions; formatting, sorting, filtering and charts.
  Includes gridcraft-cli, a headless evaluator, converter and command runner.

# The binaries link only glibc and libgcc_s directly. Windowing (X11/Wayland, xkbcommon) and the
# GPU (Vulkan, EGL/GL) are loaded at runtime, so they are dependencies/recommendations here
# rather than ELF NEEDED entries.
overrides:
  deb:
    depends:
      - libc6 (>= 2.35)
      - libgcc-s1
      - libxkbcommon0
      - libvulkan1 | libegl1
    recommends:
      - libwayland-client0
      - libx11-6
      - libx11-xcb1
      - libxcursor1
      - libxi6
      - libxrandr2
      - mesa-vulkan-drivers
      - xdg-desktop-portal
  rpm:
    # Library sonames rather than package names, so the same requirements resolve on Fedora/RHEL
    # and openSUSE (which has no libxkbcommon, vulkan-loader or libglvnd-egl package). The glibc
    # floor names libm because the binaries' GLIBC_2.35 symbols (hypot, hypotf) are libm's: RHEL 9's
    # glibc 2.34 provides libc.so.6(GLIBC_2.35) through backports, but not this, so it refuses.
    depends:
      - libc.so.6()(64bit)
      - libm.so.6(GLIBC_2.35)(64bit)
      - libgcc_s.so.1()(64bit)
      - libxkbcommon.so.0()(64bit)
      - (libvulkan.so.1()(64bit) or libEGL.so.1()(64bit))
    # The windowing libraries by soname too, so the recommendations resolve on openSUSE as well.
    recommends:
      - libwayland-client.so.0()(64bit)
      - libX11.so.6()(64bit)
      - libXcursor.so.1()(64bit)
      - libXi.so.6()(64bit)
      - libXrandr.so.2()(64bit)
      - mesa-vulkan-drivers
      - xdg-desktop-portal

contents:
  - src: ${STAGE}/usr/bin/gridcraft
    dst: /usr/bin/gridcraft
    file_info: { mode: 0755 }
  - src: ${STAGE}/usr/bin/gridcraft-cli
    dst: /usr/bin/gridcraft-cli
    file_info: { mode: 0755 }
  # Named one by one rather than as a tree of /usr/share: a tree would also own shared directories
  # such as /usr/share/mime, which openSUSE's filesystem package owns with other modes, and RPM
  # refuses to install a package that conflicts with it.
  - src: ${STAGE}/usr/share/applications/ai.storyteller.gridcraft.desktop
    dst: /usr/share/applications/ai.storyteller.gridcraft.desktop
  - src: ${STAGE}/usr/share/mime/packages/ai.storyteller.gridcraft.xml
    dst: /usr/share/mime/packages/ai.storyteller.gridcraft.xml
  - src: ${STAGE}/usr/share/metainfo/ai.storyteller.gridcraft.metainfo.xml
    dst: /usr/share/metainfo/ai.storyteller.gridcraft.metainfo.xml
  - src: ${STAGE}/usr/share/icons/hicolor/
    dst: /usr/share/icons/hicolor/
    type: tree
  - src: ${STAGE}/usr/share/doc/gridcraft/
    dst: /usr/share/doc/gridcraft/
    type: tree

scripts:
  postinstall: packaging/linux/postinst.sh
  postremove: packaging/linux/postinst.sh
